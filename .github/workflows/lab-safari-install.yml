name: "BallWise Lab Safari - instalacja"
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lab-safari-install.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ballwise-lab-safari-main
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Pobierz aktualny projekt
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Sprawdz paczke i przygotuj caly Lab
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, re, tempfile
          if os.environ.get("GITHUB_REF") != "refs/heads/main" or os.environ.get("GITHUB_REPOSITORY") != "jangleba/plan-pi-karza":
              raise SystemExit("Uruchom instalator na main w jangleba/plan-pi-karza.")
          root = pathlib.Path.cwd().resolve()
          workflow = root / ".github/workflows/lab-safari-install.yml"
          try:
              text = workflow.read_text(encoding="utf-8")
              encoded = text.split("# LAB_PAYLOAD_START\n", 1)[1].split("# LAB_PAYLOAD_END", 1)[0]
              packed = base64.b64decode("".join(line.removeprefix("# ").strip() for line in encoded.splitlines()), validate=True)
              if hashlib.sha256(packed).hexdigest() != "c3cb4bf6c3f4144f505ac93a1a9b5b81d5f0db1c0eb69b51ab1327c63d87b10b": raise ValueError("hash")
              data = json.loads(gzip.decompress(packed))
          except (ValueError, KeyError, IndexError, OSError):
              raise SystemExit("Niekompletna paczka. Wgraj ponownie oryginalny lab-safari-install.yml.")
          if data.get("version") != "ballwise-lab-installer-1.1": raise SystemExit("Nieznana wersja paczki.")
          def digest(b): return hashlib.sha256(b).hexdigest()
          def safe_path(name):
              p = pathlib.PurePosixPath(name)
              allowed = name in {"package.json", "package-lock.json", "src/routes/_tabs.plan.tsx", "src/routes/_tabs.lab.tsx", "docs/BROWSER_LAB_SAFARI.md"} or name.startswith("src/features/browser-lab/")
              path = root / name
              if p.is_absolute() or ".." in p.parts or str(p) != name or not allowed or not path.resolve().is_relative_to(root):
                  raise SystemExit("Niedozwolona ścieżka: " + name)
              if any(parent.is_symlink() for parent in [path, *path.parents] if parent.is_relative_to(root)):
                  raise SystemExit("Dowiązanie w ścieżce: " + name)
              if path.exists() and not path.is_file(): raise SystemExit("Plik jest katalogiem: " + name)
              return path
          prepared = {}
          conflicts = []
          for item in data["files"]:
              name = item["path"]
              path = safe_path(name)
              if name in prepared: raise SystemExit("Powtórzona ścieżka: " + name)
              content = base64.b64decode(item["data"], validate=True)
              if digest(content) != item["after"]: raise SystemExit("Uszkodzony plik: " + name)
              current = digest(path.read_bytes()) if path.is_file() else None
              if current not in [*item["accepted"], item["after"]]: conflicts.append(name)
              prepared[name] = content
          def read_shared(name):
              path = safe_path(name)
              if not path.is_file(): raise SystemExit("Brak pliku projektu: " + name)
              return path.read_text(encoding="utf-8")
          def json_bytes(value): return (json.dumps(value, ensure_ascii=False, indent=2) + "\n").encode()
          try:
              package = json.loads(read_shared("package.json"))
              lock = json.loads(read_shared("package-lock.json"))
              dependencies = package["dependencies"]
              packages = lock["packages"]
              root_dependencies = packages[""]["dependencies"]
              if lock["lockfileVersion"] != 3 or dependencies != root_dependencies:
                  raise ValueError("package i lockfile nie są zgodne")
              if "mp4box" in package.get("devDependencies", {}): raise ValueError("mp4box jest w devDependencies")
              existing = dependencies.get("mp4box")
              if existing not in {None, "2.3.0"}: raise ValueError("inna wersja mp4box")
              installed = packages.get("node_modules/mp4box")
              if installed is not None and installed != data["mp4box"]: raise ValueError("inna wersja lockfile mp4box")
              if existing is None:
                  dependencies["mp4box"] = "2.3.0"
                  package["dependencies"] = dict(sorted(dependencies.items()))
              if root_dependencies.get("mp4box") is None:
                  root_dependencies["mp4box"] = "2.3.0"
                  packages[""]["dependencies"] = dict(sorted(root_dependencies.items()))
              if installed is None:
                  merged = {}
                  inserted = False
                  for key, value in packages.items():
                      if not inserted and key.startswith("node_modules/") and key > "node_modules/mp4box":
                          merged["node_modules/mp4box"] = data["mp4box"]
                          inserted = True
                      merged[key] = value
                  if not inserted: merged["node_modules/mp4box"] = data["mp4box"]
                  lock["packages"] = merged
              prepared["package.json"] = json_bytes(package)
              prepared["package-lock.json"] = json_bytes(lock)
          except (KeyError, TypeError, ValueError) as error:
              raise SystemExit("Nie można bezpiecznie dodać zależności Labu: " + str(error))
          plan = read_shared("src/routes/_tabs.plan.tsx")
          legacy_import = 'import { JumpVideoLauncher } from "@/features/jump-video/JumpVideoLauncher";'
          legacy_entry = "<JumpVideoLauncher />"
          if "JumpVideoLauncher" in plan:
              if plan.count(legacy_import) != 1 or plan.count(legacy_entry) != 1 or plan.count("JumpVideoLauncher") != 3:
                  raise SystemExit("Plan zawiera zmienioną integrację wcześniejszego pomiaru skoku. Niczego nie nadpisano.")
              plan = plan.replace(legacy_import + "\n", "", 1).replace("\n\n      " + legacy_entry, "", 1)
              if "JumpVideoLauncher" in plan:
                  raise SystemExit("Wcześniejszy pomiar skoku zmienił układ w Planie. Niczego nie nadpisano.")
          import_line = 'import { LabEntry } from "@/features/browser-lab/LabEntry";'
          entry = "<LabEntry />"
          if import_line in plan and plan.count(entry) == 1:
              pass
          elif "LabEntry" not in plan:
              anchor = 'import { AppHeader } from "@/components/loadwise/ui";'
              headers = list(re.finditer(r'(?ms)^      <AppHeader\b.*?^      />', plan))
              if plan.count(anchor) != 1 or len(headers) != 1:
                  raise SystemExit("Plan zmienił układ. Paczka wymaga dopasowania; niczego nie nadpisano.")
              header = headers[0]
              plan = plan[:header.end()] + "\n\n      <LabEntry />" + plan[header.end():]
              plan = plan.replace(anchor, anchor + "\n" + import_line, 1)
          else:
              raise SystemExit("Plan zawiera inną integrację LabEntry. Niczego nie nadpisano.")
          prepared["src/routes/_tabs.plan.tsx"] = plan.encode()
          if conflicts:
              for name in conflicts: print("::error::Nieznana wersja pliku: " + name)
              raise SystemExit("Zatrzymano przed zmianą plików. Paczka wymaga dopasowania do nowej wersji Labu.")
          # Every input and conflict has been checked before any source file is changed.
          for name, content in prepared.items():
              path = safe_path(name)
              if path.is_file() and path.read_bytes() == content: continue
              path.parent.mkdir(parents=True, exist_ok=True)
              handle, temporary = tempfile.mkstemp(prefix=".lab-install-", dir=path.parent)
              try:
                  with os.fdopen(handle, "wb") as stream: stream.write(content)
                  os.replace(temporary, path)
              finally:
                  if os.path.exists(temporary): os.unlink(temporary)
          manifest = {"version": data["version"], "files": [{"path": name, "after": digest(content)} for name, content in prepared.items()]}
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "ballwise-lab-manifest.json").write_text(json.dumps(manifest), encoding="utf-8")
          print("Przygotowano cały Lab:", len(prepared), "plików. Następny krok: testy przed zapisem na GitHubie.")
      - name: Ustaw Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Ustaw npm zgodny z lockfile
        run: npm install --global npm@11.9.0
      - name: Zainstaluj zaleznosci
        run: npm ci
      - name: Sprawdz typy, testy, lint, web i mobile
        run: npm run verify:release
      - name: Zapisz tylko sprawdzony kod
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess
          manifest = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "ballwise-lab-manifest.json").read_text())
          paths = [row["path"] for row in manifest["files"]]
          for row in manifest["files"]:
              if hashlib.sha256(pathlib.Path(row["path"]).read_bytes()).hexdigest() != row["after"]:
                  raise SystemExit("Testy zmieniły plik " + row["path"] + "; zapis zatrzymany.")
          run = lambda *args: subprocess.run(["git", *args], check=True)
          run("config", "user.name", "github-actions[bot]")
          run("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          run("add", "--", *paths)
          if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode == 0:
              print("Cały Lab jest już zainstalowany. Sprawdzenie przeszło; bez dodatkowego commita.")
          else:
              run("commit", "-m", "BallWise Lab Safari: pełny moduł i stabilny instalator")
              try:
                  run("push", "origin", "HEAD:main")
              except subprocess.CalledProcessError:
                  raise SystemExit("Nie zapisano zmian na GitHubie. Jeśli main zmienił się podczas testów, uruchom ten sam workflow ponownie. Sprawdź również uprawnienia zapisu Actions. Nie wykonano force-push.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("## BallWise Lab Safari zainstalowany\n\nTypy, wszystkie testy, lint oraz build web i mobile przeszły.\n\n1. Poczekaj na synchronizację projektu z main.\n2. Dla opublikowanej strony użyj Publish → Publish changes.\n3. Otwórz Safari → Plan → Lab → Sprawdź Safari.\n4. Zaimportuj oryginalny film 1080p 120/240 FPS i wykonaj pierwszą próbę.\n\nNie potrzebujesz Xcode do testowania tej wersji w Safari. Pierwszy pomiar na fizycznym iPhonie nadal wymaga odbioru.\n")

