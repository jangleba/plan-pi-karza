# Wgraj ten jeden plik do .github/workflows na galezi main.
# Zakres: poprawiona paczka rozgrzewek i regeneracji; nie wszystkie naprawy audytu.
name: "BallWise - rozgrzewki i regeneracja v2"

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ballwise-rozgrzewki-regeneracja-v2.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ballwise-preparation-install-main
  cancel-in-progress: false

jobs:
  instalacja:
    if: github.repository == 'jangleba/plan-pi-karza' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Przygotuj Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Npm zgodny z repozytorium
        run: npm install --global npm@11.9.0
      - name: Sprawdz wersje i przygotuj pliki
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path, PurePosixPath

          ROOT = Path.cwd().resolve()
          WORKFLOW = ROOT / '.github/workflows/ballwise-rozgrzewki-regeneracja-v2.yml'
          EXPECTED = '5e48b50b2ab052133b949220b3d295f4a8b4285325501865ad2001383f47fa4f'

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          encoded = ''.join(line.removeprefix('# BW_PAYLOAD ') for line in WORKFLOW.read_text().splitlines() if line.startswith('# BW_PAYLOAD ')).encode()
          if sha(encoded) != EXPECTED:
              raise RuntimeError('Niepełny plik instalatora. Wgraj ponownie cały plik YML.')
          bundle = json.loads(gzip.decompress(base64.b64decode(encoded, validate=True)))
          if bundle.get('schema') != 2 or bundle.get('package') != 'preparation-v2-2026-10-15':
              raise RuntimeError('Nieprawidłowa paczka.')

          memory = {}
          hashes = {}
          for item in bundle['files']:
              name = item['path']
              relative = PurePosixPath(name)
              if relative.is_absolute() or '..' in relative.parts or not name.startswith('src/') or relative.suffix not in {'.ts', '.tsx', '.css'} or name in memory:
                  raise RuntimeError('Niedozwolona ścieżka w paczce: ' + name)
              path = ROOT / name
              current = path
              while current != ROOT:
                  if current.is_symlink():
                      raise RuntimeError('Nie nadpisuję dowiązania: ' + name)
                  current = current.parent
              if path.exists() and not path.is_file():
                  raise RuntimeError('Ścieżka nie jest plikiem: ' + name)
              data = item['content'].encode('utf-8')
              if sha(data) != item['sha256']:
                  raise RuntimeError('Uszkodzone dane pliku: ' + name)
              previous = path.read_bytes() if path.is_file() else None
              if (blob(previous) if previous is not None else None) not in item['accepted_git_blobs']:
                  raise RuntimeError('Kod w ' + name + ' ma nowszą lub inną wersję. Nie nadpisuję go. Przekaż ten komunikat do sprawdzenia paczki.')
              memory[name] = data
              hashes[name] = sha(data)

          if len(memory) != 20:
              raise RuntimeError('Nieprawidłowa liczba plików w paczce.')
          start = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          changed = []
          for name, data in memory.items():
              path = ROOT / name
              if path.is_file() and path.read_bytes() == data:
                  continue
              path.parent.mkdir(parents=True, exist_ok=True)
              with tempfile.NamedTemporaryFile(dir=path.parent, delete=False) as temporary:
                  temporary.write(data)
                  temp_name = temporary.name
              os.replace(temp_name, path)
              changed.append(name)

          manifest = {'files': hashes, 'base_sha': start, 'changed': changed}
          (Path(os.environ['RUNNER_TEMP']) / 'ballwise-preparation-v2.json').write_text(json.dumps(manifest))
          print('Przygotowano pliki:', len(changed), '. Zapis nastąpi dopiero po testach i buildzie.')
          PY
      - name: Zainstaluj zaleznosci
        run: npm ci
      - name: Sprawdz typy
        run: npm run typecheck
      - name: Uruchom testy
        run: npm test -- --maxWorkers=2 --testTimeout=30000
      - name: Sprawdz lint
        run: npm run lint
      - name: Zbuduj aplikacje web
        run: npm run build
      - name: Zbuduj zasoby mobilne
        run: npm run build:mobile
      - name: Zapisz sprawdzony kod
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          manifest = json.loads((Path(os.environ['RUNNER_TEMP']) / 'ballwise-preparation-v2.json').read_text())
          paths = sorted(manifest['files'])
          for name in paths:
              path = Path(name)
              if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != manifest['files'][name]:
                  raise RuntimeError('Plik zmienił się podczas testów: ' + name)
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != manifest['base_sha']:
              raise RuntimeError('Commit roboczy zmienił się podczas kontroli.')
          subprocess.run(['git', 'add', '--', *paths], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          if any(name not in paths for name in staged):
              raise RuntimeError('W indeksie są pliki spoza tej paczki. Zapis wstrzymany.')
          if staged:
              remote = subprocess.check_output(['git', 'ls-remote', 'origin', 'refs/heads/main'], text=True).split()
              if not remote or remote[0] != manifest['base_sha']:
                  raise RuntimeError('W międzyczasie zmieniono main. Uruchom instalator ponownie; nowszego kodu nie nadpisuję.')
              subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
              subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'commit', '-m', 'BallWise: rozgrzewki i regeneracja v2, blokady i prowadzenie'], check=True)
              subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
              message = 'Zapisano poprawioną paczkę rozgrzewek i regeneracji. Testy i build web/mobile zaliczone.'
          else:
              message = 'Ta wersja jest już zainstalowana. Testy i build web/mobile zaliczone.'
          print(message)
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
                  report.write(message + '\n\nZakres: rozgrzewki, prowadzenie regeneracji i wcześniejsze poprawki biegu. Pozostałe ustalenia pełnego audytu nie są wdrażane tą paczką.\n')
          PY

