name: BallWise Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ballwise-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Pełne testy, SQL i buildy web/mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ustaw npm zgodny z package-lock
        run: npm install --global npm@11.9.0

      - name: Zainstaluj zależności
        run: npm ci

      - name: Sprawdź ESLint aktywnego kodu
        run: npm run lint

      - name: Sprawdź TypeScript
        run: npx tsc --noEmit

      - name: Uruchom wszystkie testy aktywnego kodu
        run: npm test -- --testTimeout=30000

      - name: Sprawdź pełny build aplikacji
        run: npm run build

      - name: Sprawdź mobilne SPA i workery
        run: npm run build:mobile

      - name: Zachowaj artefakty kontrolne
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ballwise-quality-${{ github.sha }}
          path: |
            dist/client/index.html
            .output/nitro.json
          if-no-files-found: ignore
