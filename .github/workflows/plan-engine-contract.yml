name: BallWise Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ballwise-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typy, testy i build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Zainstaluj zależności
        run: npm ci

      - name: Sprawdź ESLint aktywnego kodu
        run: npx eslint src

      - name: Sprawdź TypeScript
        run: npm run typecheck

      - name: Uruchom wszystkie testy aktywnego kodu
        run: npx vitest run --dir src

      - name: Sprawdź pełny build aplikacji
        run: npm run build
