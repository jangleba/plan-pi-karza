name: BallWise - 17 Szybka reakcja aplikacji
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ballwise-install-packages
  cancel-in-progress: false
jobs:
  install:
    if: github.repository == 'jangleba/plan-pi-karza' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Pobierz aktualny main
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: main
        fetch-depth: 1
    - name: Sprawdz zgodnosc i naloz poprawki
      id: apply
      shell: bash
      run: |
        node <<'BALLWISE_APPLY'
        const fs = require('node:fs');
        const path = require('node:path');
        const crypto = require('node:crypto');
        const zlib = require('node:zlib');
        const hash = b => crypto.createHash('sha256').update(b).digest('hex');
        const workflow = fs.readFileSync('.github/workflows/ballwise-reakcja-17.yml', 'utf8');
        const match = workflow.match(/^# BALLWISE_PAYLOAD_BEGIN\n([\s\S]*?)^# BALLWISE_PAYLOAD_END/m);
        if (!match) throw new Error('Brak danych paczki.');
        const packed = Buffer.from(match[1].split('\n').filter(Boolean).map(line => line.replace(/^# /, '')).join(''), 'base64');
        if (hash(packed) !== '1a8a7753f10885627d11e9ee690f4efe545bc30ac2d453b6502acf3aa5f35b43') throw new Error('Uszkodzona paczka.');
        const payload = JSON.parse(zlib.gunzipSync(packed, {maxOutputLength: 32 * 1024 * 1024}));
        if (payload.version !== 1 || payload.number !== '17' || payload.repository !== 'jangleba/plan-pi-karza' || !Array.isArray(payload.files) || payload.files.length !== 46) throw new Error('Nieprawidlowa paczka.');
        const names = new Set();
        const conflicts = [], planned = [];
        for (const file of payload.files) {
          const name = file.path;
          if (typeof name !== 'string' || name.includes('\\') || path.isAbsolute(name) || name.split('/').some(p => !p || p === '.' || p === '..') || !(name.startsWith('src/') || name.startsWith('docs/') || name.startsWith('scripts/') || name === 'README.md' || name === 'vite.config.ts' || name === 'vite.mobile.config.ts') || names.has(name)) throw new Error('Nieprawidlowa sciezka.');
          names.add(name);
          let currentPath='.';
          for (const part of name.split('/')) {
            currentPath=path.join(currentPath,part);
            try { if (fs.lstatSync(currentPath).isSymbolicLink()) throw new Error('Dowiazanie w sciezce: '+name); }
            catch (error) { if (error.code !== 'ENOENT') throw error; }
          }
          const bytes=Buffer.from(file.content,'base64');
          if (hash(bytes)!==file.after) throw new Error('Uszkodzony plik: '+name);
          const current=fs.existsSync(name)?hash(fs.readFileSync(name)):null;
          if (current === file.after) continue;
          if (current !== file.before && !(file.alsoBefore ?? []).includes(current)) conflicts.push(name);
          else planned.push({name,bytes});
        }
        if (conflicts.length) throw new Error('Pliki zmieniono po przygotowaniu paczki. Niczego nie nadpisano:\n'+conflicts.join('\n'));
        for (const file of planned) {fs.mkdirSync(path.dirname(file.name),{recursive:true});fs.writeFileSync(file.name,file.bytes);}
        const manifestPath=path.join(process.env.RUNNER_TEMP || '/tmp','ballwise-reakcja-17-manifest.json');
        fs.writeFileSync(manifestPath,JSON.stringify({paths:payload.files.map(f=>f.path),hashes:Object.fromEntries(payload.files.map(f=>[f.path,f.after]))}));
        if (process.env.GITHUB_OUTPUT) fs.appendFileSync(process.env.GITHUB_OUTPUT,`changed=${planned.length>0}\n`);
        console.log(`Paczka 17: zmieniono ${planned.length} z ${payload.files.length} plikow.`);
        BALLWISE_APPLY
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      if: steps.apply.outputs.changed == 'true'
      with:
        node-version: 22.23.4
        cache: npm
    - name: Zainstaluj zaleznosci
      if: steps.apply.outputs.changed == 'true'
      run: npm install --global npm@11.9.0 && npm ci --no-audit --no-fund
    - name: Typy, testy, lint i obie kompilacje
      if: steps.apply.outputs.changed == 'true'
      run: npm run verify:release
    - name: Zapisz sprawdzone poprawki na main
      if: steps.apply.outputs.changed == 'true'
      shell: bash
      run: |
        node <<'BALLWISE_PUBLISH'
        const fs=require('node:fs');
        const path=require('node:path');
        const crypto=require('node:crypto');
        const cp=require('node:child_process');
        const manifest=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP || '/tmp','ballwise-reakcja-17-manifest.json'),'utf8'));
        for(const [name,expected] of Object.entries(manifest.hashes)) {
         const actual=crypto.createHash('sha256').update(fs.readFileSync(name)).digest('hex');
         if(actual!==expected) throw new Error('Kontrola zmienila plik: '+name+'. Nie wyslano poprawek.');
        }
        const run=(...args)=>cp.execFileSync('git',args,{stdio:'inherit'});
        run('config','user.name','github-actions[bot]');
        run('config','user.email','41898282+github-actions[bot]@users.noreply.github.com');
        run('add','--',...manifest.paths);
        run('commit','-m','BallWise: szybka reakcja aplikacji (paczka 17)');
        run('push','origin','HEAD:main');
        const commitPath=path.join(process.env.RUNNER_TEMP || '/tmp','ballwise17-installed-commit.txt');
        const fd=fs.openSync(commitPath,'w');
        try {cp.execFileSync('git',['rev-parse','HEAD'],{stdio:['ignore',fd,'inherit']});} finally {fs.closeSync(fd); }
        const commit=fs.readFileSync(commitPath,'utf8').trim();
        if(process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`## BallWise: poprawki zainstalowane\n\nCommit: ${commit}\n\nTypy, testy, lint, web i mobilny SPA przeszly. Sprawdz synchronizacje Lovable i test telefonu wedlug docs/REAKCJA-2026-10-29.md. Wersja aplikacji: 2026.10.29.17. Opublikowana strona wymaga Publish/Update, a aplikacja iOS nowej kompilacji.\n`);
        BALLWISE_PUBLISH
    - name: Paczka juz zainstalowana
      if: steps.apply.outputs.changed != 'true'
      run: echo 'Pliki paczki 17 sa juz aktualne. Nie zapisano nowego commita.'

