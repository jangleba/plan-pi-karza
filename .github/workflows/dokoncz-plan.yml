name: Dokończ plan BallWise
on:
  push:
    branches: [main]
    paths: [.github/workflows/dokoncz-plan.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dokoncz-plan-ballwise
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ballwise-paczki
          fetch-depth: 0
      - name: Sprawdź wersję i połącz main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "955311d77eb7baac47f572e70f4b104809745633" || { echo "Gałąź zmieniła się. Potrzebne ponowne sprawdzenie poprawki."; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -gt 0
            for file in "${conflicts[@]}"; do
              case "$file" in
                package.json|bun.lock) git checkout --ours -- "$file"; git add -- "$file" ;;
                *) echo "Nieoczekiwany konflikt: $file"; exit 1 ;;
              esac
            done
          fi
      - name: Wgraj sprawdzony package-lock
        env:
          LOCK_PAYLOAD_0: 
          LOCK_PAYLOAD_1: 
          LOCK_PAYLOAD_2: 
        run: |
          python3 - <<'PYLOCK'
          import base64,gzip,os,pathlib
          pathlib.Path('package-lock.json').write_bytes(gzip.decompress(base64.b64decode(''.join(os.environ[f'LOCK_PAYLOAD_{i}'] for i in range(3)))))
          PYLOCK
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci --no-audit --no-fund
      - name: Testy, TypeScript, lint, build web i mobile
        run: npm run verify:release
      - name: Zapisz wyłącznie przetestowaną poprawkę
        run: |
          set -euo pipefail
          git add package-lock.json
          git diff --cached --check
          git commit -m "Fix dependency lock and resolve main merge for training release"
          git push origin HEAD:ballwise-paczki
