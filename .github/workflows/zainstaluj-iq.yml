name: BallWise IQ — czytelność i interakcje
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/zainstaluj-iq.yml
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: ballwise-iq-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Sprawdź gałąź
      if: github.ref != 'refs/heads/main'
      run: exit 1
    - uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - name: Sprawdź wersje i zainstaluj IQ
      env:
        IQ_PAYLOAD: 
      run: "python3 - <<'PY_INSTALL'\nimport base64,hashlib,io,json,os,zipfile\nfrom pathlib import Path\n\
        z=zipfile.ZipFile(io.BytesIO(base64.b64decode(os.environ['IQ_PAYLOAD'])))\nmanifest=json.loads(z.read('__manifest.json'))\n\
        conflicts=[]\nfor name,expected in manifest['files'].items():\n    path=Path(name)\n    if path.is_absolute()\
        \ or '..' in path.parts or path.parts[0]!='src': raise SystemExit('Niedozwolona sciezka: '+name)\n\
        \    body=z.read(name)\n    if hashlib.sha256(body).hexdigest()!=expected['after']:raise SystemExit('Niepoprawna\
        \ paczka: '+name)\n    current=hashlib.sha256(path.read_bytes()).hexdigest() if path.exists()\
        \ else None\n    if current not in (*expected.get('accepted_before',[expected['before']]),expected['after']):conflicts.append(name)\n\
        if conflicts:raise SystemExit('Inna wersja plikow. Zatrzymano bez nadpisywania: '+', '.join(conflicts))\n\
        for name in manifest['files']:\n    path=Path(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(z.read(name))\n\
        Path(os.environ['RUNNER_TEMP'],'iq-paths.json').write_text(json.dumps(list(manifest['files'])))\n\
        print('Zainstalowano pliki IQ: '+str(len(manifest['files'])))\nPY_INSTALL\n"
    - name: Przygotuj zależności
      run: npm ci --no-audit --no-fund
    - name: Sprawdź całą aplikację, web i mobile
      run: npm run verify:release
    - name: Zapisz sprawdzone zmiany
      run: "python3 - <<'PY_COMMIT'\nimport json,os,subprocess\nfrom pathlib import Path\npaths=json.loads(Path(os.environ['RUNNER_TEMP'],'iq-paths.json').read_text())\n\
        subprocess.run(['git','add','--',*paths],check=True)\nif subprocess.run(['git','diff','--cached','--quiet']).returncode==0:\n\
        \    print('Ta wersja IQ jest już zainstalowana.')\nelse:\n    subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)\n\
        \    subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)\n\
        \    subprocess.run(['git','commit','-m','IQ: animowany pokaz, krotkie wskazowki i porownanie\
        \ decyzji'],check=True)\n    subprocess.run(['git','push','origin','HEAD:main'],check=True)\n\
        PY_COMMIT\n"
