name: "BallWise IQ — instalacja automatyczna"
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/zainstaluj-iq.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ballwise-iq-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
