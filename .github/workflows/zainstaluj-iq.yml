        run: |
          python3 - <<'PY_INSTALL'
          import base64,hashlib,io,json,os,zipfile
          from pathlib import Path
          z=zipfile.ZipFile(io.BytesIO(base64.b64decode(os.environ['IQ_PAYLOAD'])))
          manifest=json.loads(z.read('__manifest.json'))
          conflicts=[]
          for name,expected in manifest['files'].items():
              path=Path(name)
              if path.is_absolute() or '..' in path.parts or path.parts[0]!='src': raise SystemExit('Niedozwolona sciezka: '+name)
              body=z.read(name)
              if hashlib.sha256(body).hexdigest()!=expected['after']:raise SystemExit('Niepoprawna paczka: '+name)
              current=hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              if current not in (*expected.get('accepted_before',[expected['before']]),expected['after']):conflicts.append(name)
          if conflicts:raise SystemExit('Inna wersja plikow. Zatrzymano bez nadpisywania: '+', '.join(conflicts))
          for name in manifest['files']:
              path=Path(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(z.read(name))
          Path(os.environ['RUNNER_TEMP'],'iq-paths.json').write_text(json.dumps(list(manifest['files'])))
          print('Zainstalowano pliki IQ: '+str(len(manifest['files'])))
          PY_INSTALL
      - name: Przygotuj zależności
        run: npm ci --no-audit --no-fund
      - name: Sprawdź całą aplikację, web i mobile
        run: npm run verify:release
      - name: Zapisz sprawdzone zmiany
        run: |
          python3 - <<'PY_COMMIT'
          import json,os,subprocess
          from pathlib import Path
          paths=json.loads(Path(os.environ['RUNNER_TEMP'],'iq-paths.json').read_text())
          subprocess.run(['git','add','--',*paths],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode==0:
              print('Ta wersja IQ jest już zainstalowana.')
          else:
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','commit','-m','IQ: jasniejsze boisko, wskazowki i nauka taktyki'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY_COMMIT
