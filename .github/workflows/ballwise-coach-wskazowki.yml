name: BallWise - Coach i wskazowki 2026-10-15

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ballwise-coach-wskazowki.yml]

permissions:
  contents: write

concurrency:
  group: ballwise-coach-install-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    if: github.repository == 'jangleba/plan-pi-karza' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BALLWISE_FILES: ${{ runner.temp }}/ballwise-coach-files.nul
    steps:
      - name: Pobierz kod z tego uruchomienia
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Sprawdz wersje i zastosuj pakiet
        id: apply
        env:
          BALLWISE_PAYLOAD_SHA256: 557637ef8b3545ca5b113266f6686aa3e325245642539c3c4431b8390531c3e6
          BALLWISE_PAYLOAD_CHUNK_000: 
          BALLWISE_PAYLOAD_CHUNK_001: 
          BALLWISE_PAYLOAD_CHUNK_002: 
          BALLWISE_PAYLOAD_CHUNK_003: 
          BALLWISE_PAYLOAD_CHUNK_004: 
          BALLWISE_PAYLOAD_CHUNK_005: 
          BALLWISE_PAYLOAD_CHUNK_006: 
          BALLWISE_PAYLOAD_CHUNK_007: 
          BALLWISE_PAYLOAD_CHUNK_008: 
          BALLWISE_PAYLOAD_CHUNK_009: 
          BALLWISE_PAYLOAD_CHUNK_010: 
          BALLWISE_PAYLOAD_CHUNK_011: 
          BALLWISE_PAYLOAD_CHUNK_012: 
          BALLWISE_PAYLOAD_CHUNK_013: 
          BALLWISE_PAYLOAD_CHUNK_014: 
          BALLWISE_PAYLOAD_CHUNK_015: 
          BALLWISE_PAYLOAD_CHUNK_016: 
          BALLWISE_PAYLOAD_CHUNK_017: 
          BALLWISE_PAYLOAD_CHUNK_018: 
          BALLWISE_PAYLOAD_CHUNK_019: 
          BALLWISE_PAYLOAD_CHUNK_020: 
          BALLWISE_PAYLOAD_CHUNK_021: 
          BALLWISE_PAYLOAD_CHUNK_022: 
          BALLWISE_PAYLOAD_CHUNK_023: 
          BALLWISE_PAYLOAD_CHUNK_024: 
          BALLWISE_PAYLOAD_CHUNK_025: 
          BALLWISE_PAYLOAD_CHUNK_026: 
          BALLWISE_PAYLOAD_CHUNK_027: 
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,tempfile
          from pathlib import Path, PurePosixPath
          root=Path.cwd().resolve()
          chunks=[v for k,v in sorted(os.environ.items()) if k.startswith('BALLWISE_PAYLOAD_CHUNK_')]
          blob=base64.b64decode(''.join(chunks),validate=True)
          if hashlib.sha256(blob).hexdigest()!=os.environ['BALLWISE_PAYLOAD_SHA256']:
              raise SystemExit('Uszkodzony pakiet. Pobierz instalator ponownie.')
          entries=json.loads(gzip.decompress(blob))
          pending=[]; names=[]; seen=set()
          for item in entries:
              name=item['path']; part=PurePosixPath(name)
              if name in seen or part.is_absolute() or '..' in part.parts or not (name.startswith('src/') or name=='supabase/config.toml' or name.startswith('supabase/functions/training-coach/') or name=='supabase/functions/_shared/trainingCoachKnowledge.ts' or name=='supabase/migrations/20261015195310_training_coach_quota.sql'):
                  raise SystemExit('Nieprawidlowa sciezka w pakiecie.')
              seen.add(name); target=root.joinpath(*part.parts)
              if root not in target.resolve().parents or any(p.is_symlink() for p in [target,*target.parents] if p!=root and root in p.parents):
                  raise SystemExit('Niedozwolony link w sciezce: '+name)
              names.append(name)
              data=base64.b64decode(item['content_base64'],validate=True)
              if hashlib.sha256(data).hexdigest()!=item['after_sha256']:
                  raise SystemExit('Niepoprawna suma pliku: '+name)
              current=hashlib.sha256(target.read_bytes()).hexdigest() if target.is_file() else None
              if current==item['after_sha256']: continue
              if current!=item['before_sha256']:
                  raise SystemExit('STOP: plik ma inna wersje: '+name+'. Nic nie nadpisano. Przygotuj pakiet dla aktualnego kodu.')
              pending.append((target,data))
          # All files were checked before the first write.
          for target,data in pending:
              target.parent.mkdir(parents=True,exist_ok=True)
              fd,temporary=tempfile.mkstemp(prefix='.ballwise-',dir=target.parent)
              try:
                  with os.fdopen(fd,'wb') as file: file.write(data)
                  os.chmod(temporary,0o644); os.replace(temporary,target)
              finally:
                  if os.path.exists(temporary): os.unlink(temporary)
          Path(os.environ['BALLWISE_FILES']).write_bytes(('\0'.join(names)+'\0').encode())
          if os.environ.get('GITHUB_OUTPUT'):
              with open(os.environ['GITHUB_OUTPUT'],'a') as file: file.write('changed='+str(bool(pending)).lower()+'\n')
          print('Zastosowano '+str(len(pending))+' plikow; '+str(len(entries)-len(pending))+' juz aktualnych.')
          PY

      - name: Ustaw Node.js
        if: steps.apply.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ustaw npm
        if: steps.apply.outputs.changed == 'true'
        run: npm install --global npm@11.9.0

      - name: Zainstaluj zaleznosci
        if: steps.apply.outputs.changed == 'true'
        run: npm ci

      - name: Typy, testy, lint, web i mobile
        if: steps.apply.outputs.changed == 'true'
        run: |
          npm run typecheck
          npm test -- --maxWorkers=2 --testTimeout=30000
          npm run lint
          npm run build
          npm run build:mobile

      - name: Zapisz sprawdzone zmiany
        if: steps.apply.outputs.changed == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$remote_sha" != "$EXPECTED_SHA" ]; then
            echo "STOP: main zmienil sie w trakcie testow. Uruchom workflow ponownie."
            exit 1
          fi
          git add --pathspec-from-file="$BALLWISE_FILES" --pathspec-file-nul
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Dodaj wskazowki i Coach do cwiczen oraz jawne doswiadczenie silowe'
          git push origin HEAD:main

      - name: Podsumowanie
        run: |
          echo 'Kod sprawdzony. AI wymaga osobnego wdrozenia funkcji training-coach i konfiguracji w Supabase.' >> "$GITHUB_STEP_SUMMARY"
