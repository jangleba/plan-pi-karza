name: Radar – wdrożenie na Supabase

# Uruchamiany ręcznie: GitHub → Actions → „Radar – wdrożenie na Supabase” → Run workflow.
# Wymaga sekretów repozytorium (Settings → Secrets and variables → Actions); instrukcja: docs/RADAR-KROKI.md.
# Workflow pojawia się w Actions dopiero po scaleniu do głównej gałęzi (main).
on:
  workflow_dispatch:
    inputs:
      what:
        description: "Co wdrożyć"
        type: choice
        default: wszystko
        options: [wszystko, tylko-migracje, tylko-funkcje]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      RADAR_CRON_SECRET: ${{ secrets.RADAR_CRON_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      RADAR_CONTACT_URL: ${{ secrets.RADAR_CONTACT_URL }}
      RADAR_ALERT_WEBHOOK_URL: ${{ secrets.RADAR_ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sprawdź wymagane sekrety (wartości nie są wypisywane)
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF RADAR_CRON_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::Brak sekretu repozytorium: $v"; missing=1; fi
          done
          if [ ${#RADAR_CRON_SECRET} -lt 24 ]; then echo "::error::RADAR_CRON_SECRET jest za krótki (min. 24 znaki)"; missing=1; fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::warning::Brak ANTHROPIC_API_KEY – radar nie będzie publikował ofert (odczyt wymaga modelu)"; fi
          if [ -z "$BRAVE_SEARCH_API_KEY" ]; then echo "::notice::Brak BRAVE_SEARCH_API_KEY – wyszukiwanie wyłączone, działa monitorowanie źródeł"; fi
          exit $missing

      - name: Połącz z projektem Supabase
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Migracje bazy (0001, 0002, 0003)
        if: ${{ inputs.what != 'tylko-funkcje' }}
        run: supabase db push

      - name: Sekrety funkcji
        if: ${{ inputs.what != 'tylko-migracje' }}
        run: |
          args=("RADAR_CRON_SECRET=$RADAR_CRON_SECRET")
          if [ -n "$ANTHROPIC_API_KEY" ]; then args+=("ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"); fi
          if [ -n "$BRAVE_SEARCH_API_KEY" ]; then args+=("BRAVE_SEARCH_API_KEY=$BRAVE_SEARCH_API_KEY"); fi
          if [ -n "$RADAR_CONTACT_URL" ]; then args+=("RADAR_CONTACT_URL=$RADAR_CONTACT_URL"); fi
          if [ -n "$RADAR_ALERT_WEBHOOK_URL" ]; then args+=("RADAR_ALERT_WEBHOOK_URL=$RADAR_ALERT_WEBHOOK_URL"); fi
          supabase secrets set "${args[@]}"

      - name: Funkcje radar-discover i radar-refresh
        if: ${{ inputs.what != 'tylko-migracje' }}
        run: supabase functions deploy radar-discover radar-refresh --no-verify-jwt

      - name: Podsumowanie
        run: |
          echo "Wdrożono. Dalej (SQL Editor w Supabase): sekrety Vault i select public.radar_register_schedules(); patrz docs/RADAR-KROKI.md, krok 6." >> "$GITHUB_STEP_SUMMARY"
