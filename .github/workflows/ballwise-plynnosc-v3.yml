name: BallWise — płynność i wczytywanie planu v3
on:
  push:
    branches: [main]
    paths: [.github/workflows/ballwise-plynnosc-v3.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ballwise-startup-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sprawdź źródła i zastosuj poprawkę bez nadpisywania innych zmian
        env:
          PATCH_DATA: 
        run: |
          python3 - <<'PYFIX'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          files = json.loads(gzip.decompress(base64.b64decode(os.environ["PATCH_DATA"])))
          for name, item in files.items():
              path = Path(name)
              if path.is_absolute() or ".." in path.parts or not name.startswith("src/"):
                  raise SystemExit("Nieprawidlowy plik poprawki")
              current = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
              if current not in item["allowed"]:
                  raise SystemExit(f"Plik {name} zostal zmieniony. Zatrzymano bez nadpisywania zmian.")
              if hashlib.sha256(base64.b64decode(item["content"])).hexdigest() != item["sha256"]:
                  raise SystemExit("Nieprawidlowa suma kontrolna poprawki")
          for name, item in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(item["content"]))
          print(f"Sprawdzono i przygotowano {len(files)} plikow.")
          PYFIX
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci --no-audit --no-fund
      - name: Sprawdź typy, testy, lint oraz buildy web i mobile
        run: npm run verify:release
      - name: Zapisz poprawkę po przejściu kontroli
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/loadwise/BottomNav.tsx src/integrations/supabase/previewAuthStorage.test.ts src/integrations/supabase/previewAuthStorage.ts src/lib/loadwise/store/profileActions.test.ts src/lib/loadwise/store/profileActions.ts src/lib/loadwise/store/useHydration.test.tsx src/lib/loadwise/store/useHydration.ts src/routes/-start.loading.test.tsx src/routes/-startup.flow.test.tsx src/routes/_tabs.start.tsx src/routes/auth.tsx src/routes/index.tsx
          git add src/lib/loadwise/persist.ts src/lib/loadwise/persist.test.ts src/lib/loadwise/planIdentity.ts src/lib/loadwise/preparePlanWrite.ts
          git add src/lib/loadwise/trainingReliabilityV2.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Poprawka jest już zainstalowana.'
            exit 0
          fi
          git commit -m "Fix startup delays, failed plan reads and legacy session persistence"
          git push origin HEAD:main
