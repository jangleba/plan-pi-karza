name: "BallWise IQ — Akcje, pozycje i animacje"
"on":
  push:
    branches: [main]
    paths: ['.github/workflows/ballwise-iq-akcje.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ballwise-iq-journeys-main
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Pobierz aktualny projekt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Sprawdź wersje i zainstaluj IQ
        shell: python
        run: |
          import base64, gzip, hashlib, json, os
          from pathlib import Path, PurePosixPath

          if os.environ.get('GITHUB_REPOSITORY') != 'jangleba/plan-pi-karza' or os.environ.get('GITHUB_REF') != 'refs/heads/main':
              raise SystemExit('Uruchom instalator na main w jangleba/plan-pi-karza.')
          root = Path.cwd().resolve()
          workflow = root / '.github/workflows/ballwise-iq-akcje.yml'
          text = workflow.read_text()
          encoded = text.split('# IQ_JOURNEY_PAYLOAD_BEGIN\n', 1)[1].split('# IQ_JOURNEY_PAYLOAD_END', 1)[0]
          packed = base64.b64decode(''.join(line.removeprefix('# ').strip() for line in encoded.splitlines()), validate=True)
          if hashlib.sha256(packed).hexdigest() != '021bb298514e76c9197ac9a393e4705fcc83ab72e6693d272b2c35457f3e239e':
              raise SystemExit('Uszkodzona paczka. Wgraj oryginalny plik instalatora z ZIP-a.')
          data = json.loads(gzip.decompress(packed))
          if data['version'] != 'ballwise-iq-journey-20261015-1':
              raise SystemExit('Nieprawidłowa wersja instalatora.')
          def digest(content): return hashlib.sha256(content).hexdigest()
          def target_for(name):
              relative = PurePosixPath(name)
              allowed = name.startswith('src/features/football-iq-match/') or name in {'src/routes/_tabs.football-iq.tsx', 'docs/FOOTBALL_IQ_JOURNEYS.md'}
              target = root / name
              if not allowed or relative.is_absolute() or '..' in relative.parts or str(relative) != name or not target.resolve().is_relative_to(root):
                  raise SystemExit('Nieprawidłowa ścieżka w paczce: ' + name)
              if any(p.is_symlink() for p in [target, *target.parents] if p.is_relative_to(root)):
                  raise SystemExit('Dowiązanie zamiast pliku: ' + name)
              if target.exists() and not target.is_file():
                  raise SystemExit('Ścieżka nie jest plikiem: ' + name)
              return target
          conflicts = []
          for name, expected in data['preserved_assets'].items():
              model = target_for(name)
              if not model.is_file() or digest(model.read_bytes()) != expected:
                  conflicts.append(name + ' (inny lub brakujący model animacji)')
          prepared = []
          seen = set()
          for row in data['files']:
              name = row['path']
              if name in seen: raise SystemExit('Powtórzona ścieżka w paczce.')
              seen.add(name)
              target = target_for(name)
              content = base64.b64decode(row['data'], validate=True)
              if digest(content) != row['after']: raise SystemExit('Błędna suma pliku: ' + name)
              actual = digest(target.read_bytes()) if target.exists() else None
              if actual == row['after']: continue
              if actual != row['before']:
                  conflicts.append(name)
              prepared.append((target, content))
          if conflicts:
              raise SystemExit('Nie nadpisano żadnych plików. W repozytorium są inne wersje niż sprawdzona baza z 15.10.2026:\n' + '\n'.join(conflicts) + '\nTa paczka wymaga dopasowania do nowszego kodu.')
          for target, content in prepared:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
          print('Gotowe. Zainstalowano pliki IQ:', len(prepared), '; modele animacji zachowane.')
      - name: Przygotuj Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Ustaw npm zgodny z package-lock
        run: npm install --global npm@11.9.0
      - name: Zainstaluj zależności projektu
        run: npm ci --no-audit --no-fund
      - name: Sprawdź typy, testy, lint, web i mobile
        run: npm run verify:release
      - name: Zapisz sprawdzoną zmianę
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/features/football-iq-match src/routes/_tabs.football-iq.tsx docs/FOOTBALL_IQ_JOURNEYS.md
          if git diff --cached --quiet; then
            echo "Ta wersja IQ jest już zainstalowana."
            exit 0
          fi
          git commit -m "BallWise IQ: akcje etapowe, pozycje, tryby i powtórki"
          git push origin HEAD:main

