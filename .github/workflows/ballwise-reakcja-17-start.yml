name: BallWise 17 - Start
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ballwise-install-packages
  cancel-in-progress: false
jobs:
  install:
    if: github.repository == 'jangleba/plan-pi-karza' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: npm
      - name: Sprawdz i naloz paczke 17
        id: apply
        shell: bash
        run: |
          node <<'JS'
          const fs=require('node:fs'), path=require('node:path'), crypto=require('node:crypto');
          const file=fs.readFileSync('.github/workflows/ballwise-reakcja-17.yml');
          const digest=crypto.createHash('sha1').update('blob '+file.length+'\0').update(file).digest('hex');
          if(digest!=='72f55d2d0200dc11d0326d774f5559d82027b6f8') throw new Error('Dane paczki 17 sa zmienione. Niczego nie nadpisano.');
          const source=file.toString('utf8');
          for(const tag of ['APPLY','PUBLISH']){
            const match=source.match(new RegExp("^ {8}node <<'BALLWISE_"+tag+"'\\r?\\n([\\s\\S]*?)^ {8}BALLWISE_"+tag+"\\r?$",'m'));
            if(!match) throw new Error('Brak sekcji '+tag);
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'ballwise17-'+tag.toLowerCase()+'.cjs'),match[1].replace(/^ {8}/gm,''));
          }
          JS
          node "$RUNNER_TEMP/ballwise17-apply.cjs"
      - name: Testy i obie kompilacje
        if: steps.apply.outputs.changed == 'true'
        run: npm install --global npm@11.9.0 && npm ci --no-audit --no-fund && npm run verify:release
      - name: Zapisz sprawdzone poprawki
        if: steps.apply.outputs.changed == 'true'
        run: node "$RUNNER_TEMP/ballwise17-publish.cjs"
      - name: Paczka jest juz zainstalowana
        if: steps.apply.outputs.changed != 'true'
        run: echo "Paczka 17 jest juz aktualna."
