          83/95/8Bz97c8jKnDQA=
          """
          data = json.loads(gzip.decompress(base64.b64decode(payload)))
          root = pathlib.Path.cwd().resolve()
          if not (root / "package.json").is_file() or not (root / "src/routes").is_dir():
              raise RuntimeError("Otwórz repozytorium BallWise z package.json i katalogiem src.")
          writes = []
          for item in data["files"]:
              rel = pathlib.PurePosixPath(item["path"])
              path = root / rel
              if rel.is_absolute() or ".." in rel.parts or root not in path.resolve().parents or path.is_symlink():
                  raise RuntimeError("Nieprawidłowa ścieżka: " + item["path"])
              current = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
              if (path.exists() and not path.is_file()) or current not in (item["before"], item["after"]):
                  raise RuntimeError("Plik zmienił się od przygotowania paczki: " + item["path"] + ". Nic nie zmieniono. Potrzebna jest paczka dopasowana do bieżącego kodu.")
              content = base64.b64decode(item["content"], validate=True)
              if hashlib.sha256(content).hexdigest() != item["after"]:
                  raise RuntimeError("Nieprawidłowa zawartość paczki")
              writes.append((path, content))
          # All paths and hashes have been checked before the first write.
          for path, content in writes:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
          manifest = pathlib.Path(os.environ.get("RUNNER_TEMP", str(root))) / "cmj-video-paths.json"
          manifest.write_text(json.dumps([item["path"] for item in data["files"]]), encoding="utf-8")
          print("Dodano pomiar skoku z filmu: " + str(len(writes)) + " plików. Teraz kontrola aplikacji.")
      - name: Zainstaluj zależności
        run: npm ci --no-audit --no-fund
      - name: Sprawdź typy, testy, lint i wersję webową
        run: npm run verify
      - name: Sprawdź paczkę statyczną
        run: npm run build:mobile
      - name: Zapisz sprawdzone zmiany
        shell: python
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          import json, os, pathlib, subprocess
          def run(*args):
              subprocess.run(args, check=True)
          paths = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "cmj-video-paths.json").read_text())
          run("git", "add", "--", *paths)
          if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode == 0:
              print("Pomiar skoku jest już dodany; wszystkie kontrole przeszły.")
          else:
              run("git", "config", "user.name", "github-actions[bot]")
              run("git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
              run("git", "commit", "-m", "Add manual CMJ measurement from original video")
              run("git", "push", "origin", "HEAD:" + os.environ["TARGET_BRANCH"])
          pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("Pomiar dodany i sprawdzony. Po publikacji wersji webowej otwórz **Plan → Zmierz skok z filmu**. Pierwszy test wykonaj z oryginalnym filmem z docelowego iPhone'a.\n", encoding="utf-8")
