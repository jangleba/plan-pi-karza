          """
          
          def main():
              parser = argparse.ArgumentParser(description="Usuń Lab z BallWise")
              parser.add_argument("--apply", action="store_true", help="zastosuj zmiany")
              parser.add_argument("root", nargs="?", default=".", help="katalog repozytorium")
              parser.add_argument("--manifest", help="zapisz listę zmienianych ścieżek")
              args = parser.parse_args()
              root = pathlib.Path(args.root).resolve()
              data = json.loads(gzip.decompress(base64.b64decode(PAYLOAD)))
              if not (root / "package.json").is_file() or not (root / "src/routes").is_dir():
                  raise RuntimeError("Wskaż główny katalog repozytorium BallWise z package.json i src.")
              def path_of(relative):
                  relative_path = pathlib.PurePosixPath(relative)
                  if relative_path.is_absolute() or ".." in relative_path.parts:
                      raise RuntimeError("Nieprawidłowa ścieżka paczki")
                  p = root / relative_path
                  resolved = p.resolve()
                  if root not in resolved.parents or p.is_symlink():
                      raise RuntimeError("Niedozwolone dowiązanie/ścieżka: " + relative)
                  return p
              def read(relative):
                  p = path_of(relative)
                  if p.exists() and not p.is_file():
                      raise RuntimeError("Zamiast pliku znaleziono katalog: " + relative)
                  return p.read_bytes() if p.exists() else None
              def digest(content):
                  return hashlib.sha256(content).hexdigest() if content is not None else None
              conflicts = []
              for item in data["writes"]:
                  current = digest(read(item["path"]))
                  if current not in (item["before"], item["after"]):
                      conflicts.append(item["path"])
              for item in data["deletes"]:
                  current = digest(read(item["path"]))
                  if current not in (None, item["before"]):
                      conflicts.append(item["path"])
              allowed_deletes = {x["path"] for x in data["deletes"]}
              for directory in data["retired_dirs"]:
                  target = path_of(directory)
                  if not target.exists():
                      continue
                  if target.is_symlink() or not target.is_dir():
                      raise RuntimeError("Nieprawidłowy katalog: " + directory)
                  for p in target.rglob("*"):
                      if p.is_file() or p.is_symlink():
                          relative = p.relative_to(root).as_posix()
                          if relative not in allowed_deletes:
                              conflicts.append(relative)
              if conflicts:
                  raise RuntimeError("Pliki zmieniły się od przygotowania ZIP-a. Nic nie zmieniono: " + ", ".join(sorted(set(conflicts))))
              paths = [x["path"] for x in data["writes"] + data["deletes"]]
              if args.manifest:
                  pathlib.Path(args.manifest).write_text(json.dumps(paths), encoding="utf-8")
              if not args.apply:
                  print(f"Zgodne: {len(data['writes'])} plików do aktualizacji, {len(data['deletes'])} do usunięcia. Użyj --apply, aby zastosować paczkę.")
                  return
              # Keep originals in memory so partial I/O failure rolls back all package edits.
              originals = {p: read(p) for p in paths}
              try:
                  for item in data["writes"]:
                      p = path_of(item["path"])
                      p.parent.mkdir(parents=True, exist_ok=True)
                      content = item["content"].encode("utf-8")
                      if digest(content) != item["after"]:
                          raise RuntimeError("Uszkodzona zawartość ZIP-a")
                      p.write_bytes(content)
                  for item in data["deletes"]:
                      path_of(item["path"]).unlink(missing_ok=True)
                  for directory in data["retired_dirs"]:
                      target = path_of(directory)
                      if target.exists():
                          for child in sorted((x for x in target.rglob("*") if x.is_dir()), key=lambda x:len(x.parts), reverse=True):
                              child.rmdir()
                          target.rmdir()
              except Exception:
                  for relative, content in originals.items():
                      p = path_of(relative)
                      if content is None:
                          p.unlink(missing_ok=True)
                      else:
                          p.parent.mkdir(parents=True, exist_ok=True)
                          p.write_bytes(content)
                  raise
              print("Usunięto kod Labu, testy pomiarowe i plugin kamery. Baza wymaga osobnego zastosowania migracji; szczegóły: docs/LAB-REMOVAL.md.")
          
          if __name__ == "__main__":
              try:
                  main()
              except Exception as error:
                  print(str(error), file=sys.stderr)
                  sys.exit(1)
          
          BW_INSTALL
      - name: Sprawdź aplikację
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test -- --testTimeout=30000
          npm run lint
          npm run build
          npm run build:mobile
      - name: Zapisz usunięcie na wybranej gałęzi
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'BW_COMMIT'
          import json, os, pathlib, subprocess
          def run(args, **kwargs):
              return subprocess.run(args, check=True, **kwargs)
          paths = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'lab-removal-paths.json').read_text())
          staged_paths = []
          for path in paths:
              tracked = subprocess.run(['git', 'ls-files', '--error-unmatch', '--', path], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
              if tracked or pathlib.Path(path).exists():
                  staged_paths.append(path)
          run(['git', 'add', '-A', '--', *staged_paths])
          delta = subprocess.run(['git', 'diff', '--cached', '--quiet'])
          if delta.returncode == 0:
              print('Lab został już usunięty; brak nowych zmian.')
          elif delta.returncode == 1:
              run(['git', 'config', 'user.name', 'github-actions[bot]'])
              run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'])
              run(['git', 'commit', '-m', 'Remove Lab, measurement tests and native capture module'])
              run(['git', 'push', 'origin', 'HEAD:' + os.environ['TARGET_BRANCH']])
          else:
              raise RuntimeError('Nie udało się sprawdzić zmian Git.')
          BW_COMMIT
