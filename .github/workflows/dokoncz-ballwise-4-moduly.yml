name: "BallWise — Fuel, IQ, Lab i Plan"
"on":
  push:
    branches: [main]
    paths: ['.github/workflows/dokoncz-ballwise-4-moduly.yml', '.github/workflows/dokoncz-ballwise-4-moduly.payload.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ballwise-integrated-main
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Pobierz aktualny projekt
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Polacz poprawki bez nadpisywania nowszego kodu
        shell: python
        run: |
          import base64
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import tempfile
          import urllib.request

          WORKFLOW = 'dokoncz-ballwise-4-moduly.yml'
          VERSION = 'ballwise-integrated-20261014-1'
          PAYLOAD_SHA = '37bd03fd7d7e6169d3f9407b9587b5062894233fc383adbc9e75eb5610c463a9'
          REPOSITORY = 'jangleba/plan-pi-karza'
          MODEL = 'public/models/pose_landmarker_lite.task'
          MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task'
          MODEL_SHA = '59929e1d1ee95287735ddd833b19cf4ac46d29bc7afddbbf6753c459690d574a'

          if os.environ.get('GITHUB_REPOSITORY') != REPOSITORY or os.environ.get('GITHUB_REF') != 'refs/heads/main':
              raise SystemExit('Uruchom na main w repozytorium ' + REPOSITORY + '.')
          root = Path.cwd().resolve()
          data_path = root / '.github/workflows/dokoncz-ballwise-4-moduly.payload.txt'
          if not data_path.is_file() or data_path.is_symlink():
              raise SystemExit('Brakuje pliku danych. Wgraj oba pliki z ZIP-a do .github/workflows: dokoncz-ballwise-4-moduly.yml i dokoncz-ballwise-4-moduly.payload.txt. Nic nie zmieniono.')
          try:
              encoded = data_path.read_text(encoding='ascii')
              packed = base64.b64decode(''.join(encoded.split()), validate=True)
              if hashlib.sha256(packed).hexdigest() != PAYLOAD_SHA:
                  raise ValueError('checksum')
              data = json.loads(gzip.decompress(packed))
              if data['version'] != VERSION:
                  raise ValueError('version')
          except (ValueError, KeyError, IndexError):
              raise SystemExit('Uszkodzona paczka. Wgraj ponownie oryginalny instalator.')

          def digest(content):
              return hashlib.sha256(content).hexdigest()

          def safe_path(name):
              relative = PurePosixPath(name)
              target = root / name
              allowed = name in {'package.json', 'package-lock.json', 'capacitor.config.ts', 'src/router.tsx'} or name.startswith(('src/', 'docs/', 'public/'))
              if not allowed or relative.is_absolute() or '..' in relative.parts or str(relative) != name or not target.resolve().is_relative_to(root):
                  raise SystemExit('Niedozwolona sciezka: ' + name)
              if any(parent.is_symlink() for parent in [target, *target.parents] if parent.is_relative_to(root)):
                  raise SystemExit('Dowiazanie w sciezce: ' + name)
              if target.exists() and not target.is_file():
                  raise SystemExit('Sciezka nie jest plikiem: ' + name)
              return target

          prepared = {}
          conflicts = []
          for row in data['files']:
              name = row['path']
              target = safe_path(name)
              if name in prepared:
                  raise SystemExit('Powtorzona sciezka: ' + name)
              current = digest(target.read_bytes()) if target.is_file() else None
              if current not in (row['before'], row['after']):
                  conflicts.append(name)
              if name == MODEL:
                  if row['after'] != MODEL_SHA:
                      raise SystemExit('Nieprawidlowy model w paczce.')
                  prepared[name] = None
              else:
                  content = base64.b64decode(row['data'], validate=True)
                  if digest(content) != row['after']:
                      raise SystemExit('Nieprawidlowa zawartosc: ' + name)
                  prepared[name] = content
          if conflicts:
              raise SystemExit('Nic nie nadpisano. Nowsze zmiany wymagaja polaczenia: ' + ', '.join(conflicts))

          model_path = safe_path(MODEL)
          if model_path.is_file() and digest(model_path.read_bytes()) == MODEL_SHA:
              model_bytes = model_path.read_bytes()
          else:
              try:
                  with urllib.request.urlopen(MODEL_URL, timeout=45) as response:
                      model_bytes = response.read(8 * 1024 * 1024)
              except Exception:
                  raise SystemExit('Nie pobrano modelu Lab. Nic nie nadpisano. Uruchom akcje ponownie.')
              if digest(model_bytes) != MODEL_SHA:
                  raise SystemExit('Nieprawidlowa suma kontrolna modelu. Nic nie nadpisano.')
          prepared[MODEL] = model_bytes

          for name, content in prepared.items():
              target = safe_path(name)
              if target.is_file() and target.read_bytes() == content:
                  continue
              target.parent.mkdir(parents=True, exist_ok=True)
              handle, temporary = tempfile.mkstemp(prefix='.ballwise-integrate-', dir=target.parent)
              try:
                  with os.fdopen(handle, 'wb') as stream:
                      stream.write(content)
                  os.replace(temporary, target)
              finally:
                  if os.path.exists(temporary):
                      os.unlink(temporary)
          manifest = {'version': VERSION, 'files': [{'path': name, 'sha256': digest(content)} for name, content in prepared.items()]}
          (Path(os.environ['RUNNER_TEMP']) / 'ballwise-integrated-manifest.json').write_text(json.dumps(manifest))
          print('Polaczono z aktualnym projektem:', len(prepared), 'plikow. Teraz typy, testy i oba buildy.')

      - name: Ustaw Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Ustaw npm zgodny z package-lock
        run: npm install --global npm@11.9.0
      - name: Zainstaluj zaleznosci
        run: npm ci
      - name: Sprawdz typy
        run: npm run typecheck
      - name: Sprawdz cala aplikacje
        run: npm run test -- --maxWorkers=2 --testTimeout=30000 --hookTimeout=30000
      - name: Sprawdz jakosc kodu
        run: npm run lint
      - name: Zbuduj web i mobile
        run: npm run build && npm run build:mobile
      - name: Zapisz tylko sprawdzony kod
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          manifest=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'ballwise-integrated-manifest.json').read_text())
          paths=[row['path'] for row in manifest['files']]
          for row in manifest['files']:
              path=pathlib.Path(row['path'])
              if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest()!=row['sha256']:
                  raise SystemExit('Kontrola zmienila plik; zapis zatrzymany: '+row['path'])
          run=lambda *args:subprocess.run(['git',*args],check=True)
          run('config','user.name','github-actions[bot]')
          run('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('add','--',*paths)
          status=subprocess.run(['git','diff','--cached','--quiet']).returncode
          if status==0:
              print('Ta wersja jest juz zainstalowana; bez kolejnego commita.')
          elif status==1:
              run('commit','-m','BallWise: scalone Fuel, IQ, Lab, Plan i plynnosc')
              try:run('push','origin','HEAD:main')
              except subprocess.CalledProcessError:
                  raise SystemExit('Nie zapisano do main. Nowszy commit lub ochrona galezi; instalator nie wymusza nadpisania.')
          else:raise SystemExit('Nie mozna sprawdzic zmian do commita.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('BallWise: typy, wszystkie testy, lint oraz build web i mobile przeszly.\n\nOpublikuj aktualna wersje swoim dotychczasowym sposobem. Natywne powiadomienia wymagaja nowego builda iOS. Dokladnosc Lab wymaga porownania z tasma; zielona akcja nie jest walidacja pomiaru w terenie.\n')

