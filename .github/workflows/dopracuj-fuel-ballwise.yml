name: Dopracuj Fuel BallWise
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ballwise-fuel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  install:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Wgraj kompletne Fuel i sprawdź wersje plików
        id: apply
        shell: python
        run: |
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          workflow = Path('.github/workflows/dopracuj-fuel-ballwise.yml')
          prefix = '# FUEL_PAYLOAD: '
          payload = ''.join(line[len(prefix):] for line in workflow.read_text().splitlines() if line.startswith(prefix))
          packed = base64.b64decode(''.join(payload.split()), validate=True)
          hash_bytes = lambda content: hashlib.sha256(content).hexdigest()
          if hash_bytes(packed) != 'd6ce6f5ad8e90687700bf740f6aeda0478494b4d4642aef9c3ee514308e7cfb6':
              raise SystemExit('Uszkodzona paczka Fuel. Pobierz ponownie oryginalny ZIP.')
          data = json.loads(gzip.decompress(packed))
          writes = []
          seen = set()
          for item in data['files']:
              path = Path(item['path'])
              if path.is_absolute() or '..' in path.parts or path.parts[0] not in ('src', 'docs') or path in seen:
                  raise SystemExit('Nieprawidłowa ścieżka paczki. Nie zmieniono kodu.')
              seen.add(path)
              if any(p.is_symlink() for p in (path, *path.parents)):
                  raise SystemExit(f'Nieprawidłowa ścieżka: {path}. Nie zmieniono kodu.')
              if path.exists() and not path.is_file():
                  raise SystemExit(f'Pod ścieżką {path} jest katalog. Nie zmieniono kodu.')
              current = hash_bytes(path.read_bytes()) if path.exists() else None
              if current not in item['accepted_sha256']:
                  raise SystemExit(f'Inna wersja pliku: {path}. Nie zmieniono kodu. Przekaż autorowi paczki tę nazwę i wynik Actions.')
              content = item['content'].encode('utf-8')
              if hash_bytes(content) != item['sha256']:
                  raise SystemExit(f'Uszkodzony plik paczki: {path}. Nie zmieniono kodu.')
              if current != item['sha256']:
                  writes.append((path, content))
          # Cały pakiet jest sprawdzony przed pierwszym zapisem.
          for path, content in writes:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
          changed = bool(writes)
          if os.environ.get('GITHUB_OUTPUT'):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write(f'changed={str(changed).lower()}\n')
          print(f'Fuel: {len(writes)} zapisanych plików. Pełna aktualizacja jest przygotowana do sprawdzenia.')
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Ustaw npm zgodny z package-lock
        run: npm install --global npm@11.9.0
      - name: Zainstaluj istniejące zależności
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Sprawdź całą aplikację oraz kompilację webową i mobilną
        run: npm run verify:release
      - name: Zapisz sprawdzone Fuel w repozytorium
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/FUEL-INSTALACJA.md docs/FUEL-ZDJECIA.md src/components/fuel/FuelMealSheet.tsx src/components/fuel/FuelPhotoSheet.tsx src/components/fuel/FuelWorkspace.test.tsx src/components/fuel/FuelWorkspace.tsx src/components/fuel/StoreCheckSheet.tsx src/lib/fuel/barcode.test.ts src/lib/fuel/barcode.ts src/lib/fuel/catalog.test.ts src/lib/fuel/catalog.ts src/lib/fuel/experience.test.ts src/lib/fuel/experience.ts src/lib/fuel/foodNutrients.ts src/lib/fuel/photo.test.ts src/lib/fuel/photo.ts src/lib/fuel/request.ts src/lib/fuel/storeCheck.test.ts src/lib/fuel/storeCheck.ts src/lib/fuel/vendor/ZXING-NOTICES.txt src/lib/fuel/vendor/barcodeDecoder.d.ts src/lib/fuel/vendor/barcodeDecoder.js src/lib/loadwise/legal.ts src/lib/loadwise/localPrivacy.test.ts src/lib/loadwise/localPrivacy.ts src/routes/_tabs.fuel.tsx src/routes/data-rights.tsx src/styles/fuel-v3.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Dopracuj Fuel: Plan, porcje, przepisy, sklep i historia'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
