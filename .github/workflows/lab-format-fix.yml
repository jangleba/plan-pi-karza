name: "BallWise Lab - HD 4K 30 60 FPS"
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lab-format-fix.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ballwise-lab-safari-main
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Pobierz aktualny projekt
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Przygotuj poprawke formatow filmu
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, tempfile
          if os.environ.get("GITHUB_REF") != "refs/heads/main" or os.environ.get("GITHUB_REPOSITORY") != "jangleba/plan-pi-karza":
              raise SystemExit("Uruchom na main w jangleba/plan-pi-karza.")
          root = pathlib.Path.cwd().resolve()
          text = (root / ".github/workflows/lab-format-fix.yml").read_text(encoding="utf-8")
          try:
              encoded = text.split("# FORMATS_PAYLOAD_START\n", 1)[1].split("# FORMATS_PAYLOAD_END", 1)[0]
              packed = base64.b64decode("".join(line.removeprefix("# ").strip() for line in encoded.splitlines()), validate=True)
              if hashlib.sha256(packed).hexdigest() != "b266b2f003b713b7175e473e2079c38d3233a3eee323e334daf8ec060b995e93": raise ValueError("hash")
              data = json.loads(gzip.decompress(packed))
              if data["version"] != "ballwise-lab-formats-1.0": raise ValueError("version")
          except (ValueError, KeyError, IndexError, OSError):
              raise SystemExit("Niekompletna paczka. Wgraj ponownie oryginalny lab-format-fix.yml.")
          def digest(content): return hashlib.sha256(content).hexdigest()
          def safe_path(name):
              rel = pathlib.PurePosixPath(name)
              path = root / name
              allowed = name == "docs/BROWSER_LAB_SAFARI.md" or name.startswith("src/features/browser-lab/")
              if rel.is_absolute() or ".." in rel.parts or str(rel) != name or not allowed or not path.resolve().is_relative_to(root):
                  raise SystemExit("Niedozwolona sciezka: " + name)
              if any(parent.is_symlink() for parent in [path, *path.parents] if parent.is_relative_to(root)):
                  raise SystemExit("Dowiazanie w sciezce: " + name)
              if path.exists() and not path.is_file(): raise SystemExit("To nie plik: " + name)
              return path
          prepared = {}
          conflicts = []
          for row in data["files"]:
              name = row["path"]
              path = safe_path(name)
              if name in prepared: raise SystemExit("Powtorzona sciezka: " + name)
              content = base64.b64decode(row["data"], validate=True)
              if digest(content) != row["after"]: raise SystemExit("Uszkodzony plik: " + name)
              current = digest(path.read_bytes()) if path.is_file() else None
              if current not in [*row["accepted"], row["after"]]: conflicts.append(name)
              prepared[name] = content
          if conflicts:
              raise SystemExit("Pliki Labu maja inna wersje. Nic nie nadpisano. Lista: " + ", ".join(conflicts))
          for name, content in prepared.items():
              path = safe_path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              temporary = None
              try:
                  with tempfile.NamedTemporaryFile(dir=path.parent, delete=False) as stream:
                      temporary = stream.name
                      stream.write(content)
                  os.replace(temporary, path)
              finally:
                  if temporary and os.path.exists(temporary): os.unlink(temporary)
          manifest = [{"path": name, "after": digest(content)} for name, content in prepared.items()]
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "ballwise-formats-manifest.json").write_text(json.dumps(manifest), encoding="utf-8")
          print("Przygotowano poprawke:", len(prepared), "plikow. Przed zapisem beda pelne testy projektu.")
      - name: Ustaw Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Ustaw npm
        run: npm install --global npm@11.9.0
      - name: Zainstaluj zaleznosci
        run: npm ci
      - name: Sprawdz typy, testy, lint, web i mobile
        run: npm run verify:release
      - name: Zapisz sprawdzona poprawke
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess
          manifest = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "ballwise-formats-manifest.json").read_text())
          paths = [row["path"] for row in manifest]
          for row in manifest:
              if hashlib.sha256(pathlib.Path(row["path"]).read_bytes()).hexdigest() != row["after"]:
                  raise SystemExit("Plik zmieniony podczas weryfikacji: " + row["path"])
          run = lambda *args: subprocess.run(["git", *args], check=True)
          run("config", "user.name", "github-actions[bot]")
          run("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          run("add", "--", *paths)
          if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode == 0:
              print("Poprawka juz zainstalowana; wszystkie kontrole przeszly.")
          else:
              run("commit", "-m", "Lab: HD i 4K przy 30/60 FPS z zakresem czasowym")
              try:
                  run("push", "origin", "HEAD:main")
              except subprocess.CalledProcessError:
                  raise SystemExit("Nie zapisano zmian. Sprawdz uprawnienia Actions lub uruchom ponownie, jesli main sie zmienil. Nie wykonano force-push.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("## Poprawka Lab gotowa\n\nTypy, testy, lint oraz build web i mobile przeszly.\n\nPo synchronizacji Lovable wybierz Publish changes. Otworz Plan -> Lab. Nagraj HD 60 FPS, 5-10 s i wybierz oryginal z Plikow. 4K i 30 FPS sa tez przyjmowane. Przy 30/60 FPS wynik jest orientacyjny. Sprawdz wlasny film na iPhonie; lokalne testy nie potwierdzaja dekodowania kazdego kodeka na kazdym telefonie.\n")

