name: Dodaj skipy A B C D do BallWise
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ballwise-skips-${{ github.ref }}
  cancel-in-progress: false
jobs:
  install:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Podłącz zatwierdzone grafiki i poprawione instrukcje
        id: apply
        shell: python
        run: |
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          prefix = '# BALLWISE_PAYLOAD: '
          with open('.github/workflows/dodaj-skipy-ballwise.yml', encoding="utf-8") as workflow_file:
              payload = "".join(line[len(prefix):].strip() for line in workflow_file if line.startswith(prefix))
          data = json.loads(gzip.decompress(base64.b64decode(payload)))
          hash_bytes = lambda content: hashlib.sha256(content).hexdigest()
          writes, removals = [], []
          for item in data['code']:
              path = Path(item['path'])
              current = hash_bytes(path.read_bytes()) if path.exists() else None
              if current not in (item['old_sha256'], item['new_sha256']):
                  raise SystemExit(f"Inna wersja pliku: {path}. Nie zmieniono kodu. Przekaż tę nazwę trenerowi / autorowi paczki.")
              content = item['content'].encode()
              if hash_bytes(content) != item['new_sha256']:
                  raise SystemExit(f"Uszkodzony plik paczki: {path}")
              if current != item['new_sha256']:
                  writes.append((path, content))
          for item in data['images']:
              upload, target = Path(item['upload']), Path(item['target'])
              if target.exists() and hash_bytes(target.read_bytes()) != item['sha256']:
                  raise SystemExit(f"Pod ścieżką {target} jest inna grafika. Nie zmieniono kodu.")
              if upload.exists():
                  content = upload.read_bytes()
                  if hash_bytes(content) != item['sha256']:
                      raise SystemExit(f"Nieprawidłowa grafika: {upload}. Wgraj oryginalny PNG z paczki, bez zmiany nazwy.")
                  if not target.exists():
                      writes.append((target, content))
                  removals.append(upload)
              elif not target.exists():
                  raise SystemExit(f"Brak grafiki {upload}. Wgraj cztery PNG do głównego folderu repozytorium.")
          # Wszystkie pliki są sprawdzane przed pierwszym zapisem.
          for path, content in writes:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
          for path in removals:
              path.unlink()
          changed = bool(writes or removals)
          if os.environ.get('GITHUB_OUTPUT'):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write(f"changed={str(changed).lower()}\n")
          print(f"Gotowe: {len(writes)} zapisanych plików; grafiki i instrukcje skipów A–D podpięte.")
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Ustaw npm zgodny z package-lock
        run: npm install --global npm@11.9.0
      - name: Zainstaluj zależności
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Sprawdź typy, testy, linter oraz build webowy i mobilny
        run: npm run verify:release
      - name: Zapisz sprawdzony kod
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/lib/loadwise/skipGuides.ts src/lib/loadwise/skipGuides.test.tsx src/lib/loadwise/exerciseTechniqueImages.ts src/lib/loadwise/exerciseTechniqueImages.test.ts src/lib/courseMeasure/quickGuide.ts src/lib/loadwise/exerciseLibrary.ts src/components/loadwise/session/ExerciseQuickGuide.tsx src/components/loadwise/ExerciseDetailSheet.tsx src/components/loadwise/ExerciseRunnerScreen.tsx public/sprint/small
          for image in skip-a.png skip-b.png skip-c.png skip-d.png; do
            if git ls-files --error-unmatch "$image" >/dev/null 2>&1; then
              git add -- "$image"
            fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Dodaj grafiki i poprawione instrukcje skipów A–D'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
