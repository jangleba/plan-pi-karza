name: BallWise 40 - Zaokraglenia ruch i panele iPhone
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ballwise-install-packages
  cancel-in-progress: false
jobs:
  install:
    if: github.repository == 'jangleba/plan-pi-karza' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - name: Sprawdz pliki bazowe i naloz paczke 40
        id: apply
        shell: bash
        run: |
          node <<'BALLWISE_APPLY_40'
          const PACKED_SHA="915c63d02a8d03c62ceaf7ad0f262796cdf212fc25c1cff035e8c7da79bd1522";
          const ROOT_FILES=["eslint.config.js", "package-lock.json", "package.json", "tsconfig.app.json", "tsconfig.json", "tsconfig.node.json", "vite.config.ts", "vite.mobile.config.ts"];
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),zlib=require('node:zlib'),cp=require('node:child_process');
          const digest=b=>crypto.createHash('sha256').update(b).digest('hex');
          const workflowSource=fs.readFileSync(path.join(process.cwd(),'.github/workflows/ballwise-iphone-40.yml'),'utf8');
          const payloadBlocks=[...workflowSource.matchAll(/^# BALLWISE_40_PAYLOAD_BEGIN\r?\n([\s\S]*?)^# BALLWISE_40_PAYLOAD_END\r?$/gm)];
          if(payloadBlocks.length!==1)throw new Error('Brak lub niejednoznaczny blok danych paczki. Niczego nie nadpisano.');
          const encodedLines=payloadBlocks[0][1].split(/\r?\n/).filter(Boolean);
          if(!encodedLines.length||encodedLines.some(line=>!/^# [A-Za-z0-9+/=]+$/.test(line)))throw new Error('Nieprawidlowy blok danych paczki. Niczego nie nadpisano.');
          const packed=Buffer.from(encodedLines.map(line=>line.slice(2)).join(''),'base64');
          if(digest(packed)!==PACKED_SHA)throw new Error('Dane paczki sa zmienione. Niczego nie nadpisano.');
          const payload=JSON.parse(zlib.gunzipSync(packed,{maxOutputLength:33554432}));
          if(payload.schema!=='ballwise-installer-v1'||payload.package!==40||!Array.isArray(payload.files))throw new Error('Nieprawidlowy format paczki.');
          const root=fs.realpathSync(process.cwd()),rootFiles=new Set(ROOT_FILES);
          const seen=new Set(),planned=[];
          for(const item of payload.files){
           const p=item.path;
           if(typeof p!=='string'||p.includes('\\')||p.includes('\0')||path.posix.isAbsolute(p)||p.split('/').some(x=>!x||x==='.'||x==='..')||(!rootFiles.has(p)&&!['src/','public/','scripts/','tests/'].some(prefix=>p.startsWith(prefix)))||seen.has(p))throw new Error('Niedozwolona sciezka paczki.');
           seen.add(p);const target=path.join(root,p);
           for(let part=target;part!==root;part=path.dirname(part)){try{if(fs.lstatSync(part).isSymbolicLink())throw new Error('Sciezka symboliczna: '+p);}catch(error){if(error.code!=='ENOENT')throw error;}}
           let current=null;
           if(fs.existsSync(target)){if(!fs.lstatSync(target).isFile())throw new Error('Sciezka nie jest plikiem: '+p);current=digest(fs.readFileSync(target));}
           if(item.beforeSha256!==null&&!/^[a-f0-9]{64}$/.test(item.beforeSha256))throw new Error('Nieprawidlowy hash bazowy: '+p);
           if(item.afterSha256!==null&&!/^[a-f0-9]{64}$/.test(item.afterSha256))throw new Error('Nieprawidlowy hash docelowy: '+p);
           const body=item.afterSha256===null?null:(typeof item.contentUtf8==='string'?Buffer.from(item.contentUtf8,'utf8'):Buffer.from(item.contentBase64,'base64'));
           if(body!==null&&(digest(body)!==item.afterSha256||body.length!==item.bytes||!['100644','100755'].includes(item.mode)))throw new Error('Bledne dane pliku: '+p);
           if(current===item.afterSha256)continue;
           if(current!==item.beforeSha256)throw new Error('Plik zmienil sie od wersji bazowej: '+p+'. Niczego nie nadpisano. Pobierz paczke przygotowana dla aktualnego kodu.');
           planned.push({item,target,body});
          }
          const state={package:40,initialHead:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),files:payload.files.map(({path,beforeSha256,afterSha256,mode,bytes})=>({path,beforeSha256,afterSha256,mode,bytes})),changedPaths:planned.map(x=>x.item.path),changed:planned.length>0};
          // All files were checked before the first write; stale or new user work fails closed.
          for(const {item,target,body} of planned){
           if(body===null){fs.unlinkSync(target);continue;}
           fs.mkdirSync(path.dirname(target),{recursive:true});const temporary=target+'.ballwise40-'+process.pid;
           fs.writeFileSync(temporary,body,{mode:item.mode==='100755'?0o755:0o644});fs.renameSync(temporary,target);fs.chmodSync(target,item.mode==='100755'?0o755:0o644);
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'ballwise40-state.json'),JSON.stringify(state));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'changed='+String(state.changed)+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## BallWise40\n\nPliki paczki: '+state.files.length+'. Nalozone zmiany: '+planned.length+'.\n\n'+(state.changed?'Zmiany czekaja na testy i obie kompilacje.':'Ta wersja plikow jest juz zainstalowana.')+'\n');
          console.log('Sprawdzono '+state.files.length+' plikow; zmieniono '+planned.length+'.');
          BALLWISE_APPLY_40
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.apply.outputs.changed == 'true'
        with:
          node-version: 22.23.4
          cache: npm
      - name: Zainstaluj zaleznosci z lockfile
        if: steps.apply.outputs.changed == 'true'
        run: |
          npm install --global npm@11.9.0
          npm ci --no-audit --no-fund
      - name: Typy, testy, lint i obie kompilacje
        if: steps.apply.outputs.changed == 'true'
        run: npm run verify:release
      - name: Kontrola Fuel, treningu i IQ w Chromium
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"),path=require("node:path"),prefix=path.join(process.env.RUNNER_TEMP,"ballwise-playwright-40");fs.mkdirSync(prefix,{recursive:true});fs.writeFileSync(path.join(prefix,"package.json"),JSON.stringify({private:true}));'
          npm install --prefix "$RUNNER_TEMP/ballwise-playwright-40" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/ballwise-playwright-40/node_modules/.bin/playwright" install --with-deps chromium
          BALLWISE_PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/ballwise-playwright-40/node_modules/playwright" BALLWISE_FUEL_UI_DIR="$RUNNER_TEMP/ballwise-fuel-ui-40" node scripts/check-fuel-ui.mjs
          BALLWISE_PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/ballwise-playwright-40/node_modules/playwright" BALLWISE_IQ_UI_DIR="$RUNNER_TEMP/ballwise-iq-ui-40" node scripts/check-iq-ui.mjs
      - name: Zachowaj kontrolne widoki Fuel
        if: always() && steps.apply.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        continue-on-error: true
        with:
          name: BallWise-40-Widoki
          path: |
            ${{ runner.temp }}/ballwise-fuel-ui-40/*.png
            ${{ runner.temp }}/ballwise-fuel-ui-40/wynik.json
            ${{ runner.temp }}/ballwise-iq-ui-40/*.png
            ${{ runner.temp }}/ballwise-iq-ui-40/wynik-iq.json
            ${{ runner.temp }}/ballwise-iq-ui-40/wniosek-na-mecz.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Siedem filmow kontrolnych i rzeczywisty odczyt Lab
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 -m venv "$RUNNER_TEMP/ballwise-lab-python-40"
          "$RUNNER_TEMP/ballwise-lab-python-40/bin/pip" install --disable-pip-version-check Pillow==12.3.0
          "$RUNNER_TEMP/ballwise-lab-python-40/bin/python" scripts/generate-lab-control-videos.py "$RUNNER_TEMP/ballwise-lab-control-40"
          BALLWISE_PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/ballwise-playwright-40/node_modules/playwright" BALLWISE_LAB_UI_DIR="$RUNNER_TEMP/ballwise-lab-ui-40" node scripts/check-lab-ui.mjs
          BALLWISE_PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/ballwise-playwright-40/node_modules/playwright" BALLWISE_LAB_RECORDINGS="$RUNNER_TEMP/ballwise-lab-control-40" BALLWISE_LAB_REAL_UI_DIR="$RUNNER_TEMP/ballwise-lab-real-ui-40" node scripts/check-lab-recordings.mjs
      - name: Zachowaj kontrolne wyniki i widoki Lab
        if: always() && steps.apply.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        continue-on-error: true
        with:
          name: BallWise-40-Lab-kontrola
          path: |
            ${{ runner.temp }}/ballwise-lab-ui-40/*.png
            ${{ runner.temp }}/ballwise-lab-ui-40/wynik.json
            ${{ runner.temp }}/ballwise-lab-real-ui-40/*.png
            ${{ runner.temp }}/ballwise-lab-real-ui-40/wynik-danych.json
            ${{ runner.temp }}/ballwise-lab-real-ui-40/wynik-przegladarki.json
            ${{ runner.temp }}/ballwise-lab-control-40/WYNIKI-KONTROLNE.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Postep - prawdziwy interfejs i korekty danych w Chromium
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          BALLWISE_PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/ballwise-playwright-40/node_modules/playwright" BALLWISE_PROGRESS_UI_DIR="$RUNNER_TEMP/ballwise-progress-ui-40" node scripts/check-progress-ui.mjs
      - name: Zachowaj kontrolne widoki Postepu
        if: always() && steps.apply.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        continue-on-error: true
        with:
          name: BallWise-40-Postep
          path: |
            ${{ runner.temp }}/ballwise-progress-ui-40/*.png
            ${{ runner.temp }}/ballwise-progress-ui-40/wynik.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Spojny wyglad - rzeczywiste ekrany w Chromium
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          BALLWISE_PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/ballwise-playwright-40/node_modules/playwright" BALLWISE_DESIGN_UI_DIR="$RUNNER_TEMP/ballwise-design-ui-40" node scripts/check-design-ui.mjs
      - name: Zachowaj kontrolne widoki aplikacji
        if: always() && steps.apply.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        continue-on-error: true
        with:
          name: BallWise-40-Wyglad
          path: |
            ${{ runner.temp }}/ballwise-design-ui-40/*.png
            ${{ runner.temp }}/ballwise-design-ui-40/wynik.json
            ${{ runner.temp }}/ballwise-design-ui-40/iphone-panele.webm
          if-no-files-found: ignore
          retention-days: 7
      - name: Zapisz w main tylko sprawdzone pliki paczki
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          node <<'BALLWISE_PUBLISH_40'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),cp=require('node:child_process');
          const state=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'ballwise40-state.json'),'utf8'));
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim();
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          for(const file of state.files){const exists=fs.existsSync(file.path),actual=exists?sha(fs.readFileSync(file.path)):null;if(actual!==file.afterSha256)throw new Error('Test lub kompilacja zmienily plik paczki: '+file.path);}
          git('fetch','origin','main','--no-tags');
          if(git('rev-parse','HEAD')!==state.initialHead||git('rev-parse','origin/main')!==state.initialHead)throw new Error('Galaz main zmienila sie podczas testow. Niczego nie wypchnieto. Uruchom ponownie po sprawdzeniu aktualnego kodu.');
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com');
          git('add','--',...state.changedPaths);
          const intended=new Set(state.changedPaths),stagedPaths=git('diff','--cached','--name-only','-z').split('\0').filter(Boolean);
          if(stagedPaths.some(p=>!intended.has(p)))throw new Error('Poza paczka znaleziono dodatkowe pliki przygotowane do commita. Niczego nie wypchnieto.');
          const staged=cp.spawnSync('git',['diff','--cached','--quiet'],{encoding:'utf8'});
          if(staged.status===0){console.log('Pliki sa juz aktualne.');process.exit(0);}if(staged.status!==1)throw new Error('Nie mozna sprawdzic plikow commita.');
          git('commit','-m','BallWise: Zaokraglenia ruch i panele iPhone (paczka 40)');
          // A regular fast-forward push also refuses a race after the explicit remote check.
          git('push','origin','HEAD:refs/heads/main');
          const commit=git('rev-parse','HEAD');fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\nSprawdzone zmiany zapisano w main: `'+commit+'`.\n');console.log('Zapisano sprawdzona paczke18: '+commit);
          BALLWISE_PUBLISH_40
      - name: Paczka juz zainstalowana
        if: steps.apply.outputs.changed != 'true'
        run: echo "Paczka 40 jest juz aktualna."

