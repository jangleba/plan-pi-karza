name: BallWise - 07 Football IQ
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: ballwise-install-packages
  cancel-in-progress: false
jobs:
  install:
    if: github.repository == 'jangleba/plan-pi-karza'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Pobierz aktualny main
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: main
        fetch-depth: 1
    - name: Sprawdz kolejnosc i zgodnosc plikow
      id: apply
      shell: bash
      run: |
        node <<'BALLWISE_NODE'
        const fs = require('node:fs');
        const path = require('node:path');
        const cp = require('node:child_process');
        const crypto = require('node:crypto');
        const zlib = require('node:zlib');
        const hash = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
        const workflow = fs.readFileSync('.github/workflows/ballwise-instaluj-07.yml', 'utf8');
        const match = workflow.match(/^# BALLWISE_PAYLOAD_BEGIN\n([\s\S]*?)^# BALLWISE_PAYLOAD_END/m);
        if (!match) throw new Error('Brak danych paczki.');
        const bytes = Buffer.from(match[1].split('\n').filter(Boolean).map(line => line.replace(/^# /, '')).join(''), 'base64');
        if (hash(bytes) !== '2351d3d4b509fcaa710c5758e0226210c50531e09e9c74522e00582a8bc4bc51') throw new Error('Uszkodzona paczka.');
        const payload = JSON.parse(zlib.brotliDecompressSync(bytes, { maxOutputLength: 12 * 1024 * 1024 }));
        if (payload.version !== 1 || payload.number !== '07' || payload.repository !== 'jangleba/plan-pi-karza' || payload.files.length !== 19) throw new Error('Nieprawidlowa paczka.');
        function validPath(name) {
         if (typeof name !== 'string' || !(name.startsWith('src/') || name === 'scripts/compile-iq-clips.mjs') || name.includes('\\') || name.split('/').some(p => !p || p === '.' || p === '..')) throw new Error('Nieprawidlowa sciezka.');
         let item='.';
         for (const part of name.split('/')) {
          item=path.join(item,part);
          try { if (fs.lstatSync(item).isSymbolicLink()) throw new Error('Dowiazanie w sciezce: '+name); }
          catch (error) { if (error.code !== 'ENOENT') throw error; }
         }
        }
        const after = new Map(payload.files.map(file => [file.path,file.after]));
        if (after.size !== payload.files.length) throw new Error('Powtorzona sciezka.');
        for (const [name,expected] of Object.entries(payload.prerequisites)) {
         validPath(name);
         const current=fs.existsSync(name)?hash(fs.readFileSync(name)):null;
         if (current !== expected && current !== after.get(name)) throw new Error('Najpierw zainstaluj i polacz z main poprzednie paczki. Niezgodny plik: '+name);
        }
        const planned=[];const conflicts=[];
        for (const file of payload.files) {
         validPath(file.path);
         const target=Buffer.from(file.content,'base64');
         if (hash(target) !== file.after) throw new Error('Uszkodzony plik: '+file.path);
         const current=fs.existsSync(file.path)?hash(fs.readFileSync(file.path)):null;
         if (current === file.after) continue;
         if (current !== file.before) conflicts.push(file.path);
         else planned.push({name:file.path,bytes:target});
        }
        if (conflicts.length) throw new Error('Nowsze zmiany; niczego nie nadpisano:\n'+conflicts.join('\n'));
        for (const file of planned) { fs.mkdirSync(path.dirname(file.name),{recursive:true});fs.writeFileSync(file.name,file.bytes); }
        const manifest=path.join(process.env.RUNNER_TEMP || '/tmp','ballwise-install-07.json');
        fs.writeFileSync(manifest,JSON.stringify({paths:payload.files.map(f=>f.path),hashes:Object.fromEntries(after)}));
        if(process.env.GITHUB_OUTPUT)fs.appendFileSync(process.env.GITHUB_OUTPUT,`changed=${planned.length>0}\n`);
        console.log(`Paczka 07: zmieniono ${planned.length} z ${payload.files.length} plikow.`);
        BALLWISE_NODE
    - name: Przygotuj Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.4
        cache: npm
    - name: Zainstaluj zaleznosci
      run: npm install --global npm@11.9.0 && npm ci --no-audit --no-fund
    - name: Testy i obie kompilacje
      env:
        CI: 'true'
      run: npm run verify:release
    - name: Zapisz osobna galaz
      if: steps.apply.outputs.changed == 'true'
      shell: bash
      run: |
        node <<'BALLWISE_PUBLISH'
        const fs=require('node:fs');
        const cp=require('node:child_process');
        const path=require('node:path');
        const crypto=require('node:crypto');
        const manifest=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP || '/tmp','ballwise-install-07.json'),'utf8'));
        for(const [name,expected] of Object.entries(manifest.hashes)) if(crypto.createHash('sha256').update(fs.readFileSync(name)).digest('hex')!==expected) throw new Error('Testy zmienily plik: '+name);
        const run=(args)=>cp.execFileSync('git',args,{stdio:'inherit'});
        const branch=`ballwise/paczka-07-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
        run(['config','user.name','github-actions[bot]']);
        run(['config','user.email','41898282+github-actions[bot]@users.noreply.github.com']);
        run(['switch','-c',branch]);
        run(['add','--',...manifest.paths]);
        run(['commit','-m','BallWise: verified package 07']);
        run(['push','origin',`HEAD:refs/heads/${branch}`]);
        const url=`https://github.com/${process.env.GITHUB_REPOSITORY}/compare/main...${branch}?expand=1`;
        fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,['## Paczka 07 sprawdzona','','Testy i obie kompilacje przeszly.','','[Utworz Pull Request]('+url+')','','Polacz Pull Request z main przed uruchomieniem nastepnej paczki.',''].join(String.fromCharCode(10)));
        BALLWISE_PUBLISH
    - name: Paczka juz jest w main
      if: steps.apply.outputs.changed != 'true'
      run: |
        echo "Ta paczka jest juz w main; sprawdzenia przeszly." >> "$GITHUB_STEP_SUMMARY"

