name: "BallWise Lab - Skok w dal i 505"
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lab-skok-w-dal-505.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ballwise-lab-safari-main
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Pobierz aktualny projekt
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Przygotuj testy i sprawdz zgodnosc paczki
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,pathlib,tempfile
          if os.environ.get('GITHUB_REF')!='refs/heads/main' or os.environ.get('GITHUB_REPOSITORY')!='jangleba/plan-pi-karza':
              raise SystemExit('Uruchom na main w jangleba/plan-pi-karza.')
          root=pathlib.Path.cwd().resolve()
          try:
              text=(root/'.github/workflows/lab-skok-w-dal-505.yml').read_text(encoding='utf-8')
              encoded=text.split('# LAB_TESTS_PAYLOAD_START\n',1)[1].split('# LAB_TESTS_PAYLOAD_END',1)[0]
              packed=base64.b64decode(''.join(line.removeprefix('# ').strip() for line in encoded.splitlines()),validate=True)
              if hashlib.sha256(packed).hexdigest()!='7b95fd381c9420170b0469704b5e750d2d3bffa6517929ae92960cb84d116050':raise ValueError('hash')
              data=json.loads(gzip.decompress(packed))
              if data['version']!='ballwise-lab-tests-20261012-1.1':raise ValueError('version')
          except (ValueError,KeyError,IndexError,OSError):
              raise SystemExit('Paczka jest niekompletna. Wgraj ponownie oryginalny lab-skok-w-dal-505.yml.')
          def digest(content):return hashlib.sha256(content).hexdigest()
          def safe_path(name):
              rel=pathlib.PurePosixPath(name);path=root/name
              allowed=name in {'public/lab-wzorzec.svg','docs/LAB_SKOK_W_DAL_505.md'} or name.startswith('src/features/browser-lab/')
              if rel.is_absolute() or '..' in rel.parts or str(rel)!=name or not allowed or not path.resolve().is_relative_to(root):raise SystemExit('Niedozwolona sciezka: '+name)
              if any(parent.is_symlink() for parent in [path,*path.parents] if parent.is_relative_to(root)):raise SystemExit('Dowiazanie w sciezce: '+name)
              if path.exists() and not path.is_file():raise SystemExit('To nie plik: '+name)
              return path
          try:
              package=json.loads((root/'package.json').read_text())
              if package['dependencies'].get('mp4box')!='2.3.0':raise ValueError('mp4box')
              route=(root/'src/routes/_tabs.lab.tsx').read_text()
              if 'BrowserLab' not in route:raise ValueError('route')
          except (KeyError,ValueError,OSError):
              raise SystemExit('Ta paczka wymaga istniejacego BallWise Lab Safari. Nie zmieniono innych modulow ani zaleznosci.')
          for required in data['required']:
              path=safe_path(required['path'])
              if not path.is_file() or digest(path.read_bytes())!=required['sha256']:
                  raise SystemExit('Brak wymaganej wersji filmu testowego: '+required['path']+'. Nic nie zmieniono. Paczka wymaga dopasowania do aktualnego Labu.')
          prepared={};conflicts=[]
          for row in data['files']:
              name=row['path'];path=safe_path(name)
              if name in prepared:raise SystemExit('Powtorzona sciezka: '+name)
              content=base64.b64decode(row['data'],validate=True)
              if digest(content)!=row['after']:raise SystemExit('Uszkodzony plik: '+name)
              current=digest(path.read_bytes()) if path.is_file() else None
              if current not in [*row['accepted'],row['after']]:conflicts.append(name)
              prepared[name]=content
          if conflicts:raise SystemExit('Nowsze lub nieznane pliki Labu. Nic nie nadpisano. Paczka wymaga dopasowania: '+', '.join(conflicts))
          for name,content in prepared.items():
              path=safe_path(name)
              if path.is_file() and path.read_bytes()==content:continue
              path.parent.mkdir(parents=True,exist_ok=True)
              handle,temp=tempfile.mkstemp(prefix='.lab-tests-',dir=path.parent)
              try:
                  with os.fdopen(handle,'wb') as stream:stream.write(content)
                  os.replace(temp,path)
              finally:
                  if os.path.exists(temp):os.unlink(temp)
          manifest={'version':data['version'],'files':[{'path':name,'after':digest(content)} for name,content in prepared.items()]}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'ballwise-lab-tests-manifest.json').write_text(json.dumps(manifest),encoding='utf-8')
          print('Przygotowano skok w dal, 505, usuniecie flying i kamere:',len(prepared),'plikow. Teraz testy przed zapisem.')
      - name: Ustaw Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Ustaw npm zgodny z lockfile
        run: npm install --global npm@11.9.0
      - name: Zainstaluj zaleznosci
        run: npm ci
      - name: Sprawdz typy, wszystkie testy, lint, web i mobile
        run: npm run verify:release
      - name: Zapisz tylko sprawdzony kod
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          manifest=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'ballwise-lab-tests-manifest.json').read_text())
          paths=[row['path'] for row in manifest['files']]
          for row in manifest['files']:
              if hashlib.sha256(pathlib.Path(row['path']).read_bytes()).hexdigest()!=row['after']:raise SystemExit('Testy zmienily plik '+row['path']+'; zapis zatrzymany.')
          run=lambda *args:subprocess.run(['git',*args],check=True)
          run('config','user.name','github-actions[bot]');run('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('add','--',*paths)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode==0:
              print('Paczka jest juz zainstalowana. Testy przeszly; bez kolejnego commita.')
          else:
              run('commit','-m','Lab: skok w dal, kontrola 505, kamera na caly ekran i usuniecie flying')
              try:run('push','origin','HEAD:main')
              except subprocess.CalledProcessError:raise SystemExit('Nie zapisano zmian. Sprawdz uprawnienia Actions albo uruchom ponownie, jesli main zmienil sie podczas testow. Bez force-push.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as stream:
              stream.write('## BallWise Lab: skok w dal i 505 zainstalowane\n\nSprawdzenie typow, testy, lint oraz build web i mobile przeszly.\n\n1. Poczekaj na synchronizacje projektu z main.\n2. Dla opublikowanej strony: Publish → Publish changes.\n3. Otworz Safari → Lab. Flying nie ma juz na liscie.\n4. Nagraj pierwsza probe skoku w dal, skalibruj podloze i porownaj wynik z tasma.\n\nWykrywanie wzorca proponuje narozniki. Linia odbicia i pieta sa oznaczane recznie. Dokladnosc sportowa wymaga odbioru na fizycznym telefonie.\n')

