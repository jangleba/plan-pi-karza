# BALLWISE_PAYLOAD: +2PliF5SeYbMjeXcIts+46uHbY5Tok+cky53/PD7++8/P1TKm7UzBwA=
name: Napraw odstępy siłowni BallWise
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ballwise-improvements-${{ github.ref }}
  cancel-in-progress: false
jobs:
  install:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Dodaj poprawki zgodne z kodem repozytorium
        id: apply
        shell: python
        run: |
          import base64, gzip, hashlib, json, os
          from pathlib import Path, PurePosixPath
          prefix = '# BALLWISE_PAYLOAD: '
          with open('.github/workflows/napraw-odstepy-silowni.yml', encoding="utf-8") as workflow_file:
              payload = "".join(line[len(prefix):].strip() for line in workflow_file if line.startswith(prefix))
          compressed = base64.b64decode("".join(payload.split()), validate=True)
          if hashlib.sha256(compressed).hexdigest() != "3bb9167175c491d9e60e336ca1effdd0b6fd8d560b99911b602f92340de33868":
              raise SystemExit("Nieprawidłowa paczka poprawki.")
          manifest = json.loads(gzip.decompress(compressed))
          pending = []
          conflicts = []
          for entry in manifest["files"]:
              name = entry["path"]
              relative = PurePosixPath(name)
              if relative.is_absolute() or ".." in relative.parts or relative.parts[0] not in ("src", "docs"):
                  raise SystemExit("Nieprawidłowa ścieżka w paczce.")
              path = Path(name)
              if any(parent.is_symlink() for parent in [path, *path.parents]):
                  raise SystemExit("Ścieżka poprawki jest dowiązaniem.")
              data = base64.b64decode(entry["content_b64"], validate=True)
              if hashlib.sha256(data).hexdigest() != entry["new_sha256"]:
                  raise SystemExit("Nieprawidłowa zawartość poprawki.")
              current = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
              if current == entry["new_sha256"]:
                  continue
              if current != entry["old_sha256"]:
                  conflicts.append(name)
              pending.append((path, data))
          if conflicts:
              raise SystemExit("Te pliki mają inne zmiany. Nic nie zostało podmienione: " + ", ".join(conflicts))
          for path, data in pending:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          Path(".ballwise-gym-gap-files.json").write_text(json.dumps([entry["path"] for entry in manifest["files"]]))
          if "GITHUB_OUTPUT" in os.environ:
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("changed=" + ("true" if pending else "false") + "\n")
          print("Dodano poprawki." if pending else "Ta paczka jest już zastosowana.")
      - uses: actions/setup-node@v4
        if: steps.apply.outputs.changed == 'true'
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Ustaw npm zgodny z package-lock
        if: steps.apply.outputs.changed == 'true'
        run: npm install --global npm@11.9.0
      - name: Zainstaluj zależności
        if: steps.apply.outputs.changed == 'true'
        run: npm ci --no-audit --no-fund
      - name: Sprawdź typy, wszystkie testy, lint i wersję webową
        if: steps.apply.outputs.changed == 'true'
        run: npm run verify
      - name: Sprawdź kompilację mobilną
        if: steps.apply.outputs.changed == 'true'
        run: npm run build:mobile
      - name: Zapisz sprawdzone poprawki
        if: steps.apply.outputs.changed == 'true'
        env:
          BALLWISE_BRANCH: ${{ github.ref_name }}
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path
          paths = json.loads(Path(".ballwise-gym-gap-files.json").read_text())
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "--", *paths], check=True)
          staged = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if staged.returncode == 1:
              subprocess.run(["git", "commit", "-m", "Napraw odstępy siłowni BallWise"], check=True)
              subprocess.run(["git", "push", "origin", "HEAD:" + os.environ["BALLWISE_BRANCH"]], check=True)
          elif staged.returncode != 0:
              raise SystemExit("Nie udało się sprawdzić zmian przed zapisem.")
