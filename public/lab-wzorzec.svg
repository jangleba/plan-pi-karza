<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <rect width="210" height="297" fill="white"/>
  <g font-family="Arial,sans-serif" fill="black">
    <text x="105" y="19" text-anchor="middle" font-size="7" font-weight="bold">BallWise Lab — wzorzec podłoża</text>
    <text x="105" y="29" text-anchor="middle" font-size="4">A4 • druk 100% • bez dopasowania do strony</text>
  </g>
  <!-- The external black rectangle is exactly 200 mm by 140 mm. -->
  <rect x="5" y="42" width="200" height="140" fill="black"/>
  <rect x="13" y="50" width="184" height="124" fill="white"/>
  <g font-family="Arial,sans-serif" fill="black" font-size="4">
    <text x="105" y="197" text-anchor="middle">Zmierz zewnętrzną ramkę: 20 × 14 cm.</text>
    <text x="105" y="206" text-anchor="middle">W aplikacji wpisz faktycznie zmierzone wymiary.</text>
