<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <rect width="210" height="297" fill="white"/>
  <g font-family="Arial,sans-serif" fill="#0b1c32">
    <text x="105" y="17" text-anchor="middle" font-size="7" font-weight="700">BallWise Lab — START</text>
    <text x="105" y="27" text-anchor="middle" font-size="4">A4 • druk 100% • wyłącz „dopasuj do strony”</text>
  </g>
  <!-- Zewnętrzna krawędź ma dokładnie 200 × 240 mm. -->
  <rect x="5" y="39" width="200" height="240" fill="#000"/>
  <rect x="13" y="47" width="184" height="224" fill="#fff"/>
  <!-- Cztery znaczniki koloru odróżniają wzorzec od przypadkowego prostokąta. -->
  <g fill="#1688ff">
    <rect x="32" y="78" width="18" height="18" rx="2"/>
    <rect x="160" y="78" width="18" height="18" rx="2"/>
    <rect x="160" y="222" width="18" height="18" rx="2"/>
    <rect x="32" y="222" width="18" height="18" rx="2"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#0b1c32" text-anchor="middle">
    <text x="105" y="139" font-size="8" font-weight="700">BALLWISE</text>
    <text x="105" y="151" font-size="4.5">NIEBIESKI WZORZEC STARTOWY</text>
    <text x="105" y="166" font-size="5" font-weight="700">DŁUGĄ KRAWĘDŹ USTAW RÓWNO Z PALCAMI</text>
    <text x="105" y="179" font-size="4">Połóż płasko. Ramka i 4 niebieskie pola widoczne cały film.</text>
    <text x="105" y="192" font-size="4.5" font-weight="700">DŁUGA KRAWĘDŹ MUSI MIEĆ 20,0 CM</text>
    <text x="105" y="203" font-size="4">Jeżeli nie ma 20,0 cm — nie wykonuj pomiaru.</text>
    <text x="105" y="291" font-size="3.5">Drugi, pomarańczowy wzorzec ustaw centralnym krzyżykiem dokładnie 3,00 m dalej.</text>
  </g>
</svg>
